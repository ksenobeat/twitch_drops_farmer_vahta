<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HUES = ["#b98a3e","#4f8fbf","#c4623f","#3f9d90","#a05a7a","#6b8c46","#7c6bb0","#b05f5f"];
const hue = (id) => HUES[Math.abs([...String(id)].reduce((a,c)=>a*31+c.charCodeAt(0),7)) % HUES.length];
const initials = (name) => name.split(/\s+/).map(w=>w[0]).join("").slice(0,4).toUpperCase();

function art(cls, name, boxArt, id) {
  if (boxArt) return `<span class="art ${cls}"><img src="${esc(boxArt)}" alt="" loading="lazy"></span>`;
  return `<span class="art ${cls}" style="color:${hue(id||name)}">${esc(initials(name))}</span>`;
}
const hours = (m) => m >= 60 ? `${Math.floor(m/60)} ч ${m%60 ? (m%60)+" м" : ""}`.trim() : `${m} мин`;
const plural = (n, one, few, many) =>
  [11,12,13,14].includes(n % 100) ? many : ({1:one, 2:few, 3:few, 4:few})[n % 10] || many;
const clock = (iso) => new Date(iso).toLocaleString("ru-RU",
  { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
const hhmm = (iso) => new Date(iso).toLocaleTimeString("ru-RU",
  { hour:"2-digit", minute:"2-digit" });
const dmy = (iso) => new Date(iso).toLocaleDateString("ru-RU",
  { day:"2-digit", month:"2-digit" });
// «54:50» — часы с минутами. Для сумм эфира: «54 ч 50 м» в строку не влезает
const hm = (m) => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`;
// календарное время: до двух суток понятнее в часах, дальше — в днях
const wall = (m) => {
  if (m < 2880) return hours(Math.round(m));
  const days = Math.round(m / 1440);
  return `${days} ${plural(days, "день", "дня", "дней")}`;
};
const DAYS = ["вс","пн","вт","ср","чт","пт","сб"];
/* «Когда будет доделано». До минуты это важно только на сегодня-завтра; внутри
   недели день недели читается сам, а дальше «ср» уже ничего не значит — нужна
   дата. Кампания с редким эфиром теперь запросто тянется восемь суток. */
const doneBy = (when) => {
  const day = midnight(when), today = midnight(new Date());
  if (day === today) return `сегодня ${hhmm(when)}`;
  if (day - today < 6 * 86400000) return `${DAYS[new Date(when).getDay()]} ${hhmm(when)}`;
  return `до ${dmy(when)}`;
};
const midnight = (d) => { const c = new Date(d); c.setHours(0,0,0,0); return +c; };
// следующая полночь, а не «плюс сутки»: переход на зимнее время сдвинул бы день
const nextDay = (key) => { const c = new Date(key); c.setDate(c.getDate() + 1); return +c; };

async function get(url, opts) {
  const r = await fetch(url, opts);
  if (r.status === 401) { location.replace('/auth/login'); throw new Error('Нужен вход'); }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ---------- Сейчас ---------- */
/* Добавить игру в вотчлист. Просят об этом с двух экранов: из «Моих игр» и
   с пустого «Сейчас», где это единственное осмысленное действие. */
async function addGame(input, note, after) {
  const name = input.value.trim();
  if (!name) return;
  const r = await fetch("/api/watchlist", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ game: name }) });
  const data = await r.json();
  note.textContent = r.ok
    ? (data.added ? `Добавил: ${data.name}` : `${data.name} уже в вотчлисте`)
    : data.error;
  if (!r.ok) return;
  input.value = "";
  if (after) after(); else { planCache = null; tick(); }
}

/* Подсказки при вводе названия игры.
   Список — из своей базы: каталог Twitch, приехавший со сборкой, плюс игры,
   которые «Вахта» видела сама, плюс сегодняшние кампании. Раньше здесь были
   только девяносто игр с активными дропсами — по замеру, который говорил, что
   каталог не нужен. Замер был верен, но не покрывал случая, ради которого сюда
   и приходят чаще всего: завести игру, у которой кампании **сегодня** нет,
   чтобы она подхватилась сама, когда дропсы появятся. Такую в списке из
   девяноста не найти по определению.
   Сети запрос не требует, поэтому и работает всегда — в том числе без токена.
   Игру не из списка добавляют как раньше — поиском по названию. */
let gameHints = null;

async function fillGameHints() {
  if (gameHints) return;
  gameHints = [];  // вторая попытка не нужна: список за сессию не меняется
  let names = [];
  try {
    names = (await get("/api/games")).games || [];
  } catch (e) {
    return;  // служба не ответила — поле остаётся обычным, ввод работает
  }
  gameHints = names;
  const list = document.createElement("datalist");
  list.id = "dropGames";
  list.innerHTML = names.map(n => `<option value="${esc(n)}">`).join("");
  document.body.append(list);
  // список появился позже полей — перевешиваем привязку, чтобы наверняка
  document.querySelectorAll('[list="dropGames"]').forEach(el => el.setAttribute("list", "dropGames"));
}

/* Список подтягивается по фокусу, а не при отрисовке: кто игру не добавляет,
   тот и запроса не делает. */
function hintGames(input) {
  if (!input) return;
  input.setAttribute("list", "dropGames");
  input.addEventListener("focus", fillGameHints, { once: true });
}

/* Шапка экрана: кнопки ставит сам экран, оболочка только держит место. */
const screenActions = (html) => { $("screenActions").innerHTML = html; };

function wireRefresh() {
  const btn = $("refresh");
  if (!btn) return;
  btn.onclick = async () => {
    btn.textContent = "Пересчёт…";
    planCache = await get("/api/replan", { method: "POST" });
    await tick();
  };
}

/* Запас задачи — сколько ещё можно тянуть, прежде чем она перестанет
   помещаться: от конца её последнего блока до дедлайна. Считается по плану,
   службе для этого ничего досчитывать не нужно. */
function slackOf(plan) {
  const last = {};
  for (const b of plan.blocks) {
    const end = +new Date(b.end);
    if (!(b.game_id in last) || end > last[b.game_id]) last[b.game_id] = end;
  }
  return plan.tasks
    .filter(t => t.game_id in last)
    .map(t => ({ task: t, minutes: (+new Date(t.deadline) - last[t.game_id]) / 60000 }))
    .sort((a, b) => a.minutes - b.minutes);
}

// Меньше шести часов запаса — «в обрез». Порог не с потолка: запас считается
// в эфирных минутах, а эфир идёт не круглые сутки, так что шесть эфирных часов
// это примерно сутки календарных — за это время стример может и не выйти.
const TIGHT = 360;

function shiftCard(live, paused) {
  const pct = live.required ? Math.min(100, live.current / live.required * 100) : 0;
  const left = Math.max(0, live.required - live.current);
  if (paused) {
    return `<div class="shift-card paused">
      ${art("md", live.game || "—", live.boxArt, live.game)}
      <div class="shift-body">
        <div class="shift-top"><h3>${esc(live.game)}</h3>
          <span class="sub">· смена остановлена на ${live.current} из ${live.required} мин</span></div>
        <div class="track dim"><i style="width:${pct}%"></i></div>
        <div class="said">Прогресс сохранён. Twitch засчитывает просмотр только пока идёт
          эфир — за время паузы счётчик не двигается.</div>
      </div></div>`;
  }
  return `<div class="shift-card">
    ${art("md", live.game, live.boxArt, live.game)}
    <div class="shift-body">
      <div class="shift-top"><h3>${esc(live.game)}</h3><div class="spacer"></div>
        <span class="pill ${live.note === "в эфире" ? "live" : "mute"}">
          <i class="dot"></i>${esc(live.note)}</span></div>
      <div class="sub" style="margin:-6px 0 10px">${esc(live.campaign)}${
        live.channel ? " · канал " + esc(live.channel) : ""}</div>
      ${live.required ? `<div class="track"><i style="width:${pct}%"></i></div>
      <div class="under">
        <span>${live.current} / ${live.required} мин${
          live.drops ? ` · дроп ${live.drop} из ${live.drops}` : ""}</span>
        <span>осталось ${hours(left)}</span>
      </div>`
      // пока канал не найден, минут ещё нет: пустая полоса и «0 / 0 мин»
      // читаются как поломка, хотя это нормальное начало смены
      : `<div class="said">Ищу стрим, на котором идёт эта кампания. Живые каналы
          по игре есть не всегда — если не найдётся, окно уйдёт следующей
          задаче, а к этой «Вахта» вернётся сама.</div>`}
    </div></div>`;
}

/* График смен: блоки плана, разложенные по дням.

   Блоки пересекаются, и это не ошибка: эфир делится, а не резервируется —
   пока по одной игре никто не стримит, «Вахта» смотрит другую. Поэтому сутки
   собираются не из отрезков подряд, а из ожидаемых минут: сколько эфира
   кампания наберёт именно в этот день. Блок, накрывающий несколько суток,
   попадает в каждые своей частью. */
function board(plan, live) {
  // «не влезает целиком» и «не успеваем вообще ничего» — разные вещи: первое
  // норма (последняя веха не влезла), второе повод вмешаться
  const partial = new Set(plan.shortfalls.filter(s => s.reachable).map(s => s.campaign));
  const bad = new Set(plan.shortfalls.filter(s => !s.reachable).map(s => s.campaign));
  const tight = new Set(slackOf(plan).filter(s => s.minutes < TIGHT).map(s => s.task.campaign));
  const byDay = new Map();
  for (const b of plan.blocks) {
    const from = +new Date(b.start), to = +new Date(b.end), span = to - from;
    for (let key = midnight(b.start); key < to; key = nextDay(key)) {
      const till = nextDay(key);
      const head = Math.max(from, key), tail = Math.min(to, till);
      if (tail <= head) continue;
      const air = span ? b.minutes * (tail - head) / span : b.minutes;
      // строка «0 мин» ничего не сообщает: округлилось в ноль — значит за эти
      // сутки по кампании не наберётся и минуты
      if (Math.round(air) < 1) continue;
      if (!byDay.has(key)) byDay.set(key, []);
      byDay.get(key).push({
        ...b, from: head, to: tail, minutes: air,
        opens: head > key, closes: tail < till,
      });
    }
  }

  let rows = "";
  const today = midnight(new Date());
  for (const [key, slices] of [...byDay].sort((a, b) => a[0] - b[0])) {
    const when = new Date(key);
    const name = key === today
      ? `сегодня · ${DAYS[when.getDay()]} ${dmy(when)}`
      : `${DAYS[when.getDay()]} ${dmy(when)}`;
    const airtime = slices.reduce((a, s) => a + s.minutes, 0);
    rows += `<div class="day"><span>${name}</span>
      <span>эфира ожидается ${hours(Math.round(airtime))}</span></div>`;
    for (const s of slices.sort((a, b) => a.from - b.from || b.minutes - a.minutes)) {
      const running = farmingNow && farmingNow === s.campaign;
      const cls = bad.has(s.campaign) ? "bad" : running ? "on" : "";
      const state = bad.has(s.campaign) ? `<span class="state bad">решить</span>`
        : running ? `<span class="state on">идёт</span>`
        : partial.has(s.campaign) ? `<span class="state warn">не целиком</span>`
        : tight.has(s.campaign) ? `<span class="state warn">в обрез</span>`
        : `<span class="state">в плане</span>`;
      rows += `<div class="slot ${cls}">
        <div class="when">${slotWhen(s)}<small>${hours(Math.round(s.minutes))}</small></div>
        <i class="mark"></i>${art("xs", s.game, s.box_art, s.game_id)}
        <div class="grow"><div class="t">${esc(s.game)}</div>
          <div class="s">${esc(s.campaign)}</div></div>${state}</div>`;
    }
  }
  // то, чему места не нашлось вовсе: блоков у таких задач нет
  for (const s of plan.shortfalls) {
    if (plan.blocks.some(b => b.campaign === s.campaign)) continue;
    rows += `<div class="slot bad">
      <div class="when">не влезает<small>нужно ${hours(s.missing)}</small></div>
      <i class="mark"></i>${art("xs", s.game, "", s.game)}
      <div class="grow"><div class="t">${esc(s.game)}</div>
        <div class="s">дедлайн ${dmy(s.deadline)} · не хватает ${hours(s.missing)} эфира</div></div>
      <span class="state bad">решить</span></div>`;
  }
  if (!rows) return "";
  return `<div><div class="board-h"><span class="label">график смен · 14 дней</span>
    <span class="aside">кампании идут вперемешку: пока по одной нет эфира, «Вахта»
      смотрит другую</span></div>
    <div class="board">${rows}</div></div>`;
}

/* Что про этот день можно сказать честно. У кампании с редким эфиром блок
   накрывает сутки целиком, и «00:00→00:00» не значит ничего; у той, что идёт
   встык, границы как раз и есть ответ. */
function slotWhen(s) {
  if (s.opens && s.closes) return `${hhmm(s.from)}→${hhmm(s.to)}`;
  if (s.opens) return `с ${hhmm(s.from)}`;
  if (s.closes) return `до ${hhmm(s.to)}`;
  return "весь день";
}

/* Сколько эфира нужно плану. Минуты кампаний не складываются: у одной игры
   их бывает несколько, и один просмотр двигает все — сумма насчитывала бы
   одну и ту же работу по нескольку раз. Берём самую долгую по каждой игре. */
function airOf(plan) {
  const byGame = new Map();
  for (const t of plan.tasks) {
    byGame.set(t.game_id, Math.max(byGame.get(t.game_id) || 0, t.minutes));
  }
  return [...byGame.values()].reduce((a, b) => a + b, 0);
}

/* Вилка «что важнее». Выбор здесь всегда об одном — какая из двух кампаний
   важнее, — и понятен он только когда у обеих сторон видна цена. Прежняя подпись
   «Отказаться от X» называла одну потерю и сравнить её было не с чем.

   «Оставить как есть» — не кнопка, а то, что случится, если ничего не нажимать.
   Отдельной кнопкой это было бы обманом: она ничего не делает, а вопрос всё
   равно вернётся с ближайшим пересчётом. Поэтому просто сказано словами. */
function fork(s) {
  if (!s.options.length) return "";
  const drops = (n) => `${n} ${plural(n, "дроп", "дропа", "дропов")}`;
  return `<div class="ask">
    <div class="label">что важнее?</div>
    ${s.options.map(o => `<button class="btn sm" data-decide="${esc(o.drop_id)}">
      ${esc(s.game)}
      <span class="sub" style="margin:3px 0 0;display:block">возьмём ${o.gain} из
        ${o.total} вместо ${o.keep} · «${esc(o.drop_game)}» перестанем фармить,
        и ${o.rival_keeps ? `его ${drops(o.rival_keeps)} уйдут` : "его дропы уйдут"}</span>
    </button>`).join("")}
    <p class="sub">Оставить как есть — ${esc(s.game)} возьмёт ${s.reachable} из
      ${s.drops}, ${s.options.map(o => `«${esc(o.drop_game)}» свои
      ${o.rival_keeps} из ${o.rival_total}`).join(", ")}. Ничего нажимать
      не нужно.</p></div>`;
}

/* Правая колонка. Её наполняет экран, оболочка только держит место. */
function nowRail(live, plan) {
  // Раньше здесь стояло «конфликтов дедлайнов» красным. Красное — про аварию,
  // а «последняя веха не влезла» это не авария: янтарное говорит то же самое
  // и не требует реакции. Красным остаётся только «не успеваем ничего»
  const partial = plan.shortfalls.length;
  const nothing = plan.shortfalls.filter(s => s.drops && !s.reachable).length;
  const work = airOf(plan);
  let html = `<div class="rail-in"><div class="tiles">
    <div class="tile"><b>${plan.tasks.length}</b><small>${
      plural(plan.tasks.length, "кампания", "кампании", "кампаний")} в работе</small></div>
    <div class="tile"><b>${hm(work)}</b><small>эфира на плане</small></div>
    <div class="tile ${nothing ? "bad" : partial ? "warn" : ""}"><b>${partial}</b><small>${
      plural(partial, "кампания", "кампании", "кампаний")} влезает не целиком</small></div>
    <div class="tile ${plan.unconfident.length ? "warn" : ""}"><b>${plan.unconfident.length}</b>
      <small>${plural(plan.unconfident.length, "игра", "игры", "игр")} без замеров</small></div></div>`;

  // «Не влезает» — сведение, а не задача. Дропы это вехи одного потока
  // просмотра, поэтому нехватка означает «последнюю веху не возьмём», а не
  // «всё впустую». Красным и «решить» это становится только когда не успеваем
  // вообще ничего и когда есть чем помочь — варианты проверены пересчётом
  for (const s of plan.shortfalls) {
    const nothing = s.drops > 0 && s.reachable === 0;
    html += `<div class="box ${nothing ? "bad" : "warn"}">
      <div class="label">${nothing ? "не успеваем" : "влезает не целиком"}</div>
      <p>${esc(s.game)} · ${esc(s.campaign)}. Дедлайн ${dmy(s.deadline)}, не хватает
        <b>${hours(s.missing)}</b> эфира. ${s.drops
          ? nothing
            ? `Ни один из ${s.drops} ${plural(s.drops, "дропа", "дропов", "дропов")} не успеет.`
            : `<b>Успеем ${s.reachable} ${plural(s.reachable, "дроп", "дропа", "дропов")}
               из ${s.drops}</b> — не влезает только последний.`
          : ""}${
        s.competitors.length ? ` Окно делит ${esc(s.competitors.join(", "))}.` : ""}</p>
      ${fork(s)}</div>`;
  }

  // Без привязанного игрового аккаунта Twitch вообще не открывает дроп-сессию:
  // прогресс не «идёт медленно», его нет совсем. Это самая дорогая тихая беда
  // из всех — часы просмотра впустую, — и место ей на том экране, куда смотрят,
  // а не только в «Каталоге» и «Расписании»
  if (plan.unlinked.length) {
    const games = [...new Set(plan.unlinked.map(c => c.game))];
    const link = plan.unlinked.find(c => c.link)?.link;
    html += `<div class="box warn"><div class="label">нужна привязка</div>
      <p>По ${esc(games.join(", "))} прогресс не пойдёт вовсе: пока игровой аккаунт
        не привязан на сайте издателя, Twitch не начинает дроп-сессию — смотреть
        такую кампанию бессмысленно. ${plan.unlinked.length}
        ${plural(plan.unlinked.length, "кампания", "кампании", "кампаний")} ждёт.</p>
      ${link ? `<div class="acts"><a class="btn sm" href="${esc(link)}" target="_blank"
        rel="noopener" style="text-decoration:none">Привязать на twitch.tv</a></div>` : ""}
      </div>`;
  }

  if (plan.unconfident.length) {
    html += `<div class="box warn"><div class="label">оценка приблизительная</div>
      <p>По ${esc(plan.unconfident.join(", "))} ещё мало замеров эфира — сколько времени
        по игре реально идут стримы с дропсами, пока считается грубо. График уточнится сам.</p>
      </div>`;
  }

  if (live.today.length) {
    html += `<div><div class="label" style="margin-bottom:6px">забрано сегодня</div>` +
      live.today.map(t => `<div class="taken">${art("xs", t.game, t.box_art, t.game_id)}
        <span class="grow">${esc(t.game)} · ${esc(t.drop)}</span>
        <span class="at">${hhmm(t.at)}</span></div>`).join("") + `</div>`;
  }
  return html + `</div>`;
}

/* Пока смены нет, экран показывает то, чем служба занята. Одного слова мало:
   обход вотчлиста идёт минутами, и «обхожу список игр» без объяснения читается
   как «зависло». Поясняем только долгие состояния — для остальных слово
   говорит само за себя. */
const NOTE_HINT = {
  "обхожу список игр": `Спрашиваю Twitch по каждой игре из списка: какие кампании
    открыты и сколько по ним осталось. На десятке игр это занимает минуты — фарм
    начнётся сразу после обхода, ждать ничего не нужно.`,
  "возвращаюсь": "Пауза снята, сейчас пересоберу график и вернусь в эфир.",
  "нужен вход в Twitch": `Просмотр засчитывается тому аккаунту, под которым
    «Вахта» смотрит. Войти — во вкладке «Настройки».`,
  "нет связи с Twitch": "Проверю ещё раз сама, ничего нажимать не нужно.",
};

/* Домен в надписи меняется, поэтому подсказка ищется не по всему слову.
   Совет один и тот же: если один домен Twitch не открывается, а остальные
   работают, дело почти всегда в фильтре — spade.twitch.tv лежит в блок-листах
   трекеров, и без него минуты не засчитываются вовсе. */
const BLOCKED_HINT = `Остальные домены Twitch при этом отвечают, значит дело
  не в интернете, а в фильтре: этот адрес режет блокировщик рекламы, DNS-сервер
  или антивирус. Через spade.twitch.tv Twitch считает минуты просмотра, и он есть
  в списках трекеров — добавь его в исключения, и фарм пойдёт сам.`;

function noteCard(note) {
  const hint = note.endsWith("не открывается") ? BLOCKED_HINT : NOTE_HINT[note];
  return `<div class="nothing" style="padding:34px 40px"><div class="void">
    <h2>${esc(note)}</h2>${hint ? `<p>${hint}</p>` : ""}</div></div>`;
}

function renderNow(live, plan) {
  const paused = !!live.paused_since;
  const empty = !plan.tasks.length && !live.farming;
  const now = new Date();

  $("head").hidden = empty;
  $("screenStamp").textContent =
    `${DAYS[now.getDay()]} · ${dmy(now)} · ${hhmm(now)}`;

  if (empty) {
    screenActions("");  // пересчитывать нечего, вставать на паузу — тоже
    $("nowBody").innerHTML = `<div class="void">
      <svg class="mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
        <rect x="6" y="7" width="20" height="4" rx="2" opacity=".5"></rect>
        <rect x="9" y="14" width="14" height="4" rx="2"></rect>
        <rect x="12" y="21" width="8" height="4" rx="2" opacity=".5"></rect></svg>
      <h2>смен нет</h2>
      <p>Добавь игры, за которыми стоит следить, — программа сама найдёт кампании,
        посчитает эфир и построит график. Игру можно добавить до того, как по ней
        появится кампания: каталог обходится раз в полчаса, и я сообщу, когда она
        откроется.</p>
      <div class="addrow" style="padding:0;border:0">
        <input id="voidGame" placeholder="Название игры, например Rust">
        <button class="btn primary" id="voidAdd">Добавить</button></div>
      <div class="hint" id="voidNote">или открой каталог${
        live.shell.counts.cat ? " · " + live.shell.counts.cat + " активных кампаний" : ""}</div></div>`;
    $("rail").innerHTML = "";
    $("voidAdd").onclick = () => addGame($("voidGame"), $("voidNote"));
    $("voidGame").onkeydown = (e) => { if (e.key === "Enter") $("voidAdd").click(); };
    hintGames($("voidGame"));
    return;
  }

  if (paused) {
    const lost = Math.round((Date.now() - +new Date(live.paused_since)) / 60000);
    $("screenName").textContent = `Вахта на паузе · ${hours(lost)}`;
    screenActions(`<button class="btn primary sm" id="doResume">Продолжить</button>
      <button class="btn sm" id="doLogout">Выйти из Twitch</button>`);
    $("doResume").onclick = async () => {
      $("doResume").textContent = "Возвращаюсь...";
      await fetch("/api/resume", { method: "POST" });
      planCache = null;
      tick();
    };
    $("doLogout").onclick = async () => {
      await fetch("/api/twitch/logout", { method: "POST" });
      planCache = null;
      tick();
    };

    const soon = slackOf(plan)[0];
    const цена = [];
    if (soon) {
      const when = new Date(Date.now() + soon.minutes * 60000);
      цена.push(`К ${dmy(when)}, ${hhmm(when)} запас ${esc(soon.task.game)} уйдёт в минус —
        кампания закроется ${dmy(soon.task.deadline)}.`);
    }
    for (const s of plan.shortfalls) {
      цена.push(`${esc(s.game)} уже не помещается: не хватает ${hours(s.missing)} эфира.`);
    }
    $("nowBody").innerHTML = (live.game ? shiftCard(live, true) : "") +
      (цена.length ? `<div class="warn-box"><div class="label">что будет, если не вернуться</div>
        <p>${цена.join(" ")}</p></div>` : "") +
      `<div class="hint" style="margin-top:26px;font-family:var(--mono);font-size:10px;
        letter-spacing:.18em;text-transform:uppercase;color:var(--faint)">
        пауза снимается отсюда и командой /pause off в telegram</div>`;
    $("rail").innerHTML = "";
    return;
  }

  // «Смена идёт» — только когда Twitch правда засчитывает минуты. Пока канал
  // ищется, смена ещё не началась, и говорить обратное значит врать в заголовке
  $("screenName").textContent = live.note === "в эфире" ? "Смена идёт"
    : live.farming ? "Ищу канал" : "Сейчас";
  screenActions(`<button class="btn sm" id="refresh">Пересчитать</button>
    <button class="btn sm" id="doPause">Пауза</button>`);
  wireRefresh();
  $("doPause").onclick = async () => {
    $("doPause").textContent = "Встаю...";
    await fetch("/api/pause", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ minutes: 60 }) });
    planCache = null;
    tick();
  };

  $("nowBody").innerHTML =
    (live.farming ? shiftCard(live, false) : noteCard(live.note)) +
    board(plan, live);
  $("rail").innerHTML = nowRail(live, plan);

  document.querySelectorAll("[data-decide]").forEach(b => b.onclick = async () => {
    b.textContent = "Применяю...";
    await fetch("/api/decide/" + b.dataset.decide, { method: "POST" });
    planCache = await get("/api/plan");
    tick();
  });
}

/* ---------- Расписание ---------- */
let schedFilter = "all";  // все · риск · завершённые

/* Запас по кампаниям: сколько ещё можно тянуть до дедлайна. Считается по
   плану — дедлайн минус конец последнего блока; у того, что не помещается,
   запас отрицательный и равен нехватке. `till` — тот самый конец, то есть
   когда работа будет доделана: теперь кампании идут вперемешку, и «когда
   начнётся» почти у всех «сейчас», а вот «когда закончится» — разное. */
function slackByCampaign(plan) {
  const last = {}, first = {}, work = {};
  for (const b of plan.blocks) {
    const from = +new Date(b.start), to = +new Date(b.end);
    if (!(b.campaign in first) || from < first[b.campaign]) first[b.campaign] = from;
    if (!(b.campaign in last) || to > last[b.campaign]) last[b.campaign] = to;
    work[b.campaign] = (work[b.campaign] || 0) + b.minutes;
  }
  const gaps = new Map(plan.shortfalls.map(s => [s.campaign, s]));
  const out = new Map();
  for (const t of plan.tasks) {
    const gap = gaps.get(t.campaign);
    out.set(t.campaign, {
      task: t,
      minutes: gap ? -gap.missing
        : t.campaign in last ? (+new Date(t.deadline) - last[t.campaign]) / 60000 : 0,
      from: first[t.campaign] ?? null,
      till: last[t.campaign] ?? null,
      work: work[t.campaign] ?? t.minutes,
      gap,
    });
  }
  return out;
}

function slackCell(minutes, scale) {
  if (minutes === null) {
    return `<div class="slack none"><div class="bar2"></div><em>—</em></div>`;
  }
  const over = minutes < 0;
  const cls = over ? "over" : minutes < TIGHT ? "tight" : "";
  const width = over ? 100 : Math.max(4, Math.min(100, minutes / scale * 100));
  return `<div class="slack ${cls}"><div class="bar2"><i style="width:${width}%"></i></div>
    <em>${over ? "−" : "+"}${hours(Math.abs(Math.round(minutes)))}</em></div>`;
}

function renderPlan(plan) {
  const slack = slackByCampaign(plan);
  const risky = [...slack.values()].filter(s => s.minutes < TIGHT);
  const scale = Math.max(60, ...[...slack.values()].map(s => Math.max(0, s.minutes)));
  const work = airOf(plan);
  const games = new Set(plan.tasks.map(t => t.game_id)).size;
  const nearest = plan.shortfalls[0];

  const chips = [
    ["all", "Все", plan.tasks.length + plan.unlinked.length + (plan.waiting || []).length
      + (plan.stuck || []).length + (plan.refused || []).length],
    ["risk", "В обрез", risky.length],
    ["done", "Завершённые", plan.done.length],
  ];

  let rows = "";
  let shown = [];   // те же кампании рисует Гант — фильтр у них общий
  if (schedFilter === "done") {
    for (const c of plan.done) {
      rows += `<div class="gr"><span class="win">закрыта</span>
        <div class="camp">${art("xs", c.game, c.box_art, c.game_id)}
          <span class="t">${esc(c.game)}</span><span class="s">${esc(c.campaign)}</span></div>
        ${slackCell(null)}<span class="dl">${clock(c.deadline)}</span>
        <span class="state">забрано</span></div>`;
    }
  } else {
    // по концу работы, а не по началу: начинается всё сразу, отличается только
    // то, когда закончится
    shown = [...slack.values()]
      .filter(s => schedFilter !== "risk" || s.minutes < TIGHT)
      .sort((a, b) => (a.till ?? Infinity) - (b.till ?? Infinity));
    for (const s of shown) {
      // «Идёт» — про то, что фармится на самом деле, а не про то, что стоит
      // первым в плане: голова плана может быть пропущена, если по игре нет
      // канала, и тогда график врал бы «идёт» на простаивающей кампании
      const t = s.task;
      const running = farmingNow && farmingNow === t.campaign;
      const quiet = (plan.quiet || []).includes(t.game_id);
      const when = s.till === null
        ? "нет окна"
        : `${doneBy(s.till)} · ${hours(Math.round(s.work))}`;
      const state = s.gap && s.gap.drops && !s.gap.reachable
          ? `<span class="state bad">решить</span>`
        : s.gap ? `<span class="state warn">не целиком</span>`
        : running ? `<span class="state on">идёт</span>`
        : quiet ? `<span class="state warn">нет канала</span>`
        : s.minutes < TIGHT ? `<span class="state warn">в обрез</span>`
        : `<span class="state">в плане</span>`;
      rows += `<div class="gr ${
        s.gap && s.gap.drops && !s.gap.reachable ? "bad" : running ? "on" : ""}">
        <span class="win">${when}</span>
        <div class="camp">${art("xs", t.game, t.box_art, t.game_id)}
          <span class="t">${esc(t.game)}</span><span class="s">${esc(t.campaign)}</span></div>
        ${slackCell(s.minutes, scale)}<span class="dl">${clock(t.deadline)}</span>
        ${state}</div>`;
    }
    // без привязанного игрового аккаунта прогресс не идёт вообще, поэтому
    // планировщик такие кампании в работу не берёт — но показать их надо
    if (schedFilter === "all") {
      for (const c of plan.unlinked) {
        rows += `<div class="gr"><span class="win">${hours(c.minutes)}</span>
          <div class="camp">${art("xs", c.game, c.box_art, c.game_id)}
            <span class="t">${esc(c.game)}</span>
            <span class="s warn">аккаунт не привязан</span></div>
          ${slackCell(null)}<span class="dl">${clock(c.deadline)}</span>
          ${c.link ? `<a class="state warn" href="${esc(c.link)}" target="_blank"
            rel="noopener" style="text-decoration:none">привязать</a>`
            : `<span class="state warn">привязать</span>`}</div>`;
      }
      // от чего отказались при разборе конфликта. Решение человека, но
      // невидимое и необратимое решение — это ловушка: одно нажатие мимо,
      // и кампания пропадает молча. Показываем и даём вернуть
      for (const c of (plan.refused || [])) {
        rows += `<div class="gr"><span class="win">отказ</span>
          <div class="camp">${art("xs", c.game, c.box_art, c.game_id)}
            <span class="t">${esc(c.game)}</span>
            <span class="s">${esc(c.campaign)} · ${hours(c.minutes)} эфира</span></div>
          ${slackCell(null)}<span class="dl">${clock(c.deadline)}</span>
          <button class="state" data-return="${esc(c.id)}">вернуть</button></div>`;
      }
      // Фармить нельзя вовсе: по замерам канала с этой кампанией не бывает.
      // В плане её нет намеренно — планировать «по проценту в сутки» значило бы
      // выдумывать работу, — но причина видна, и по ней понятно, ждать или нет
      for (const c of (plan.waiting || [])) {
        rows += `<div class="gr"><span class="win">ждёт эфира</span>
          <div class="camp">${art("xs", c.game, c.box_art, c.game_id)}
            <span class="t">${esc(c.game)}</span>
            <span class="s warn">${esc(c.campaign)} · ${esc(c.reason)}</span></div>
          ${slackCell(null)}<span class="dl">${clock(c.deadline)}</span>
          <span class="state warn">ждёт</span></div>`;
      }
      // отложенные обходчиком: Twitch считает время, но дроп не отдаёт.
      // Окно ушло другой кампании, но пропасть с экрана они не должны
      for (const c of (plan.stuck || [])) {
        rows += `<div class="gr bad"><span class="win">до ${hhmm(c.until)}</span>
          <div class="camp">${art("xs", c.game, c.box_art, c.game_id)}
            <span class="t">${esc(c.game)}</span>
            <span class="s warn">${esc(c.reason || "отложена")} — вернусь позже</span></div>
          ${slackCell(null)}<span class="dl">${c.deadline ? clock(c.deadline) : "—"}</span>
          ${c.link ? `<a class="state bad" href="${esc(c.link)}" target="_blank"
            rel="noopener" style="text-decoration:none">проверить привязку</a>`
            : `<span class="state bad">отложена</span>`}</div>`;
      }
    }
  }

  // пример про эфирное время берём с самой «редкой» игры, у которой есть замеры
  const rare = plan.tasks.filter(t => t.confident)
    .sort((a, b) => a.availability - b.availability)[0];

  $("schedBody").innerHTML = `
    <div class="summary">
      <div class="cell"><div class="label">эфира на плане</div><b>${hm(work)}</b>
        <small>${plan.tasks.length} ${plural(plan.tasks.length, "кампания", "кампании", "кампаний")},
          ${games} ${plural(games, "игра", "игры", "игр")}</small></div>
      <div class="cell ${plan.shortfalls.some(s => s.drops && !s.reachable) ? "bad"
          : plan.shortfalls.length ? "warn" : ""}">
        <div class="label">влезает не целиком</div>
        <b>${plan.shortfalls.length}</b>
        <small>${nearest
          ? esc(nearest.game) + " · возьмём " + nearest.reachable + " из " + nearest.drops
          : "всё помещается"}</small></div>
      <div class="cell ${plan.unlinked.length ? "warn" : ""}"><div class="label">без привязки</div>
        <b>${plan.unlinked.length}</b>
        <small>${plan.unlinked.length ? "прогресс = 0" : "все аккаунты привязаны"}</small></div>
    </div>

    <div class="board-h"><span class="label">график смен</span>
      <span class="aside">14 дней вперёд, по эфирному времени: кампании идут вперемешку</span>
      <div style="flex:1 1 auto"></div>
      <div class="chips">${chips.map(([id, name, n]) => `<button class="btn sm${
        schedFilter === id ? " on" : ""}" data-filter="${id}">${name}${
        n ? ` <span style="color:var(--faint)">${n}</span>` : ""}</button>`).join("")}</div></div>

    ${gantt(plan, shown)}

    ${rows ? `<div class="grid">
      <div class="gh"><span>когда</span><span>кампания</span><span>запас до дедлайна</span>
        <span>дедлайн</span><span>статус</span></div>${rows}</div>`
      : `<div class="nothing"><div class="void"><h2>${schedFilter === "risk"
        ? "Всё помещается" : schedFilter === "done" ? "Закрытых пока нет" : "Фармить нечего"}</h2>
        <p>${schedFilter === "risk"
        ? "Ни одна кампания не упирается в дедлайн: запас есть у всех."
        : schedFilter === "done" ? "Сюда попадают кампании, по которым забрано всё."
        : "По играм из списка активных кампаний сейчас нет — открывшуюся заметит обход."}</p>
        </div></div>`}

    ${rare ? `<div class="note-under">Запас считается по накопленной статистике эфира:
      у ${esc(rare.game)} стримы с дропсами идут около ${Math.round(rare.availability * 24)} ч
      в сутки, поэтому ${hours(rare.minutes)} эфира растянутся
      на ${wall(rare.minutes / rare.availability)} календарного времени.</div>` : ""}`;

  $("schedBody").querySelectorAll("[data-return]").forEach(b => b.onclick = async () => {
    b.textContent = "возвращаю…";
    await fetch("/api/decide/" + b.dataset.return, { method: "DELETE" });
    planCache = null;
    tick();
  });

  $("schedBody").querySelectorAll("[data-filter]").forEach(b => b.onclick = () => {
    schedFilter = b.dataset.filter;
    renderPlan(plan);
  });
}

/* Диаграмма Ганта — главный вид «Расписания».
   Строками таблица отвечала на «сколько запаса и почему», но не на «когда»:
   план с 30 июля делит эфир, а не резервирует календарь, поэтому кампании
   идут вперемешку, полосы пересекаются и у каждой своя доля. Это видно только
   картинкой; таблица осталась под ней и отвечает на прежние вопросы.

   Толщина полосы — доля эфира: во всю высоту значит «окно целиком её»,
   вполовину — «делит с кем-то поровну». Без этого две пересекающиеся полосы
   читались бы как «оба фармятся полностью», а так не бывает. */
const DAY = 86400000;

function ganttRow(blocks, deadline, t0, span, tone) {
  const at = (ms) => Math.max(0, Math.min(100, (ms - t0) / span * 100));
  const bars = blocks.map(b => {
    const left = at(+new Date(b.start));
    const right = at(+new Date(b.end));
    // Доля показывается высотой. Не «доля × высота строки»: у кампании с десятью
    // процентами полоса вышла бы в три пикселя и слилась бы с линией сетки.
    // Растягиваем в диапазон 30–100%, зато порядок сохраняется — равная
    // толщина всегда значит равную долю
    const thick = Math.round(30 + Math.min(1, b.share || 1) * 70);
    return `<i class="bar ${tone}" style="left:${left}%;width:${
      Math.max(0.6, right - left)}%;height:${thick}%"
      title="${esc(b.game)} · ${esc(b.campaign)}\n${clock(b.start)} — ${clock(b.end)}\n${
        hours(b.minutes)} эфира, ${Math.round((b.share || 1) * 100)}% окна"></i>`;
  }).join("");
  const mark = deadline && +new Date(deadline) <= t0 + span
    ? `<i class="dl-mark" style="left:${at(+new Date(deadline))}%"
         title="дедлайн ${clock(deadline)}"></i>` : "";
  return bars + mark;
}

function gantt(plan, shown) {
  if (!shown.length || !plan.starts_at) return "";
  const t0 = +new Date(plan.starts_at);
  // конец шкалы — самый дальний из концов работы и дедлайнов, но не больше
  // горизонта плана: иначе одна кампания с дедлайном через полгода сплющила бы
  // все остальные в первый пиксель
  const ends = [
    ...plan.blocks.map(b => +new Date(b.end)),
    ...shown.map(s => s.task.deadline ? +new Date(s.task.deadline) : 0),
  ].filter(Boolean);
  const t1 = Math.min(+new Date(plan.ends_at), Math.max(t0 + DAY, ...ends));
  const span = Math.max(DAY, t1 - t0);

  // Сетка по суткам: полночь по местному времени, а не «через 24 часа от
  // сейчас» — глазу нужны понедельник и вторник, а не отметки от старта
  const ticks = [];
  const first = new Date(t0);
  first.setHours(0, 0, 0, 0);
  for (let d = +first + DAY; d < t1; d += DAY) {
    const left = (d - t0) / span * 100;
    // Ближайшая полночь может оказаться в паре часов от старта — тогда её
    // подпись садится поверх «сейчас». Линию оставляем, подпись убираем:
    // без неё сетка читается, а поверх друг друга не читается ничего
    ticks.push(`<i class="tick" style="left:${left}%"></i>${left < 6 ? "" :
      `<em class="tick-t" style="left:${left}%">${
        new Date(d).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" })}</em>`}`);
  }

  const rows = shown.map(s => {
    const t = s.task;
    const mine = plan.blocks.filter(
      b => b.campaign === t.campaign && b.game_id === t.game_id);
    const running = farmingNow && farmingNow === t.campaign;
    const tone = s.gap && s.gap.drops && !s.gap.reachable ? "bad"
      : s.gap || s.minutes < TIGHT ? "warn"
      : running ? "on" : "";
    return `<div class="gan-r">
      <div class="gan-n">${art("xs", t.game, t.box_art, t.game_id)}
        <span class="t">${esc(t.game)}</span></div>
      <div class="gan-t">${mine.length
        ? ganttRow(mine, t.deadline, t0, span, tone)
        : `<span class="gan-none">нет окна</span>`}</div></div>`;
  }).join("");

  return `<div class="gantt">
    <div class="gan-r gan-h"><div class="gan-n">кампания</div>
      <div class="gan-t">${ticks.join("")}<em class="tick-t now">сейчас</em></div></div>
    ${rows}
    <div class="gan-legend">Полоса — когда идёт просмотр, её толщина — какая доля
      эфира достаётся кампании: эфир делится, поэтому полосы и пересекаются.
      Штрих — дедлайн.</div></div>`;
}

/* ---------- Мои игры ----------
   Порядок = кто получит окно, когда две кампании просят одно время. Правило
   перетаскивания и подписи — из design/notes.md, там оно расписано по шагам.
   Порядок сохраняется сразу, график пересчитывается только по «Применить». */
const GRIP = `<svg viewBox="0 0 8 12" aria-hidden="true"><circle cx="1.5" cy="1.5" r="1.5"/>
  <circle cx="6.5" cy="1.5" r="1.5"/><circle cx="1.5" cy="6" r="1.5"/>
  <circle cx="6.5" cy="6" r="1.5"/><circle cx="1.5" cy="10.5" r="1.5"/>
  <circle cx="6.5" cy="10.5" r="1.5"/></svg>`;
const WL_HEAD = 6;  // сколько строк видно до сворачивания хвоста

let wlRows = [];        // вотчлист как он сейчас на экране
let wlOpen = false;     // раскрыт ли хвост списка
let wlDirty = null;     // {game_id, from} — что переехало и откуда
let wlPreview = null;   // план, каким он станет после «Применить»

function wlPlace(n, total) {
  return n === 1 ? "станет первым" : n === total ? "станет последним" : `будет ${n}-й`;
}

function wlRow(g, index, total) {
  const share = g.availability;
  const airtime = share === null ? "нет замеров"
    : `${hours(Math.round(share * 1440))}${g.samples ? ` · ${g.samples} ${
        plural(g.samples, "замер", "замера", "замеров")}` : ""}`;
  const cls = share === null ? "none" : share < 0.3 ? "thin" : "";
  const state = wlState(g);
  return `<div class="wr" data-row="${esc(g.game_id)}" data-index="${index}" tabindex="0">
    <button class="grip" data-grip="${esc(g.game_id)}" title="Тащи или Alt+↑↓"
      aria-label="Переместить ${esc(g.name)}">${GRIP}</button>
    <input class="num" data-pos="${esc(g.game_id)}" value="${index + 1}"
      inputmode="numeric" autocomplete="off" title="Впиши номер и нажми Enter"
      aria-label="Место ${esc(g.name)} в списке">
    <div class="who2">${art("xs", g.name, g.box_art, g.game_id)}
      <div style="min-width:0"><div class="t">${esc(g.name)}</div>
        ${state.sub ? `<div class="s ${state.dim ? "dim" : ""}">${state.sub}</div>` : ""}</div></div>
    <div class="air ${cls}"><div class="bar2"><i style="width:${
      share === null ? 0 : Math.round(share * 100)}%"></i></div><em>${airtime}</em></div>
    <span class="state ${state.tone}">${state.word}</span>
    <button class="btn sm danger" data-rm="${esc(g.game_id)}"
      style="font-size:10px;letter-spacing:.12em;text-transform:uppercase">убрать</button></div>`;
}

/* Что с игрой происходит прямо сейчас. Берётся из плана, а не из вотчлиста:
   сам вотчлист знает только порядок и статистику эфира. */
function wlState(g) {
  const plan = planCache;
  if (!plan) return { word: "", tone: "", sub: "" };
  if (plan.unlinked.some(c => c.game_id === g.game_id)) {
    return { word: "привязать", tone: "warn", sub: "аккаунт не привязан — прогресс 0" };
  }
  const gap = plan.shortfalls.find(s => s.game === g.name);
  if (gap) {
    return gap.drops && !gap.reachable
      ? { word: "не успеваем", tone: "bad", sub: "" }
      : { word: "не целиком", tone: "warn",
          sub: `возьмём ${gap.reachable} из ${gap.drops}` };
  }
  if ((plan.waiting || []).some(c => c.game_id === g.game_id)) {
    return { word: "ждёт эфира", tone: "warn", sub: "нужных каналов нет в эфире" };
  }
  // «фармится» — про то, что правда в эфире: голова плана может стоять без
  // канала, а кампании теперь идут вперемешку, и первый блок больше не значит
  // «сейчас смотрим именно это»
  if (farmingNow && plan.tasks.some(t => t.game_id === g.game_id && t.campaign === farmingNow)) {
    return { word: "фармится", tone: "on", sub: "" };
  }
  if (plan.tasks.some(t => t.game_id === g.game_id)) return { word: "в плане", tone: "", sub: "" };
  if (plan.done.some(c => c.game_id === g.game_id)) return { word: "закрыта", tone: "", sub: "" };
  return { word: "ждёт", tone: "", sub: "кампаний нет — сообщу, когда откроется", dim: true };
}

/* Цена изменения: сравниваем запас по нынешнему плану и по тому, каким он
   станет после пересчёта. Разница и есть то, что меняет порядок. */
function wlPrice() {
  if (!wlDirty || !wlPreview || !planCache) return "";
  const было = slackByCampaign(planCache), стало = slackByCampaign(wlPreview);
  const дельты = [];
  for (const [campaign, after] of стало) {
    const before = было.get(campaign);
    if (!before) continue;
    const delta = Math.round(after.minutes - before.minutes);
    if (Math.abs(delta) >= 1) дельты.push({ game: after.task.game, delta });
  }
  дельты.sort((a, b) => b.delta - a.delta);
  const кто = wlRows.find(g => g.game_id === wlDirty.game_id);
  const место = wlRows.findIndex(g => g.game_id === wlDirty.game_id) + 1;

  const вниз = дельты.find(d => d.delta < 0);
  const куда = место === 1 ? "станет первой" : `встанет ${место}-й`;
  const рассказ = !дельты.length
    ? `${esc(кто.name)} ${куда}. График от этого не изменится: окна распределяет дедлайн,
       а порядок решает только ничью.`
    : вниз
    ? `${esc(кто.name)} ${куда} — при споре за окно она забирает время
       у ${esc(вниз.game)}, и запас ${esc(вниз.game)} падает.`
    : `${esc(кто.name)} ${куда}. Ничей запас от этого не пострадал — окна просто легли плотнее.`;

  return `<div class="box"><div class="label">что меняет порядок</div>
    <p>${рассказ}</p>
    <div style="margin-top:12px">
      ${дельты.map(d => `<div class="price"><span>${esc(d.game)}</span>
        <em class="${d.delta > 0 ? "up" : "down"}">${d.delta > 0 ? "+" : "−"}${
          hours(Math.abs(d.delta))}</em></div>`).join("")
        || `<div class="price"><span>Все игры</span><em>без изменений</em></div>`}
    </div>
    <div class="acts"><button class="btn primary sm" id="wlApply">Применить</button>
      <button class="btn sm" id="wlUndo">Отмена</button></div></div>`;
}

async function wlLoadPreview() {
  try {
    wlPreview = await get("/api/watchlist/preview");
  } catch {
    wlPreview = null;
  }
  paintGames();
}

/* Перерисовка без запроса к службе: порядок уже в wlRows. */
function paintGames() {
  const total = wlRows.length;
  const видно = wlOpen ? wlRows : wlRows.slice(0, WL_HEAD);
  const хвост = wlOpen ? [] : wlRows.slice(WL_HEAD);

  $("gamesBody").innerHTML = total ? `
    <div class="wl" id="wlList">
      <div class="wh"><span></span><span>№</span><span>игра</span>
        <span>эфир в сутки</span><span>сейчас</span><span></span></div>
      ${видно.map((g, i) => wlRow(g, i, total)).join("")}
      ${хвост.length ? `<button class="wl-tail" id="wlMore">${WL_HEAD + 1}–${total} ·
        ${хвост.map(g => esc(g.name)).join(", ")}</button>` : ""}
    </div>
    <div class="note-under">Порядок сохраняется сразу. График пересчитывается после
      «Применить».</div>`
    : `<div class="nothing"><div class="void"><h2>Список пуст</h2>
        <p>Добавь игру — следить можно и за той, по которой кампаний ещё нет:
           обход сам заметит, когда она откроется.</p></div></div>`;

  $("rail").innerHTML = `<div class="rail-in">
    ${wlPrice()}
    <div class="addrow" style="border:0;padding:0">
      <input id="newGame" placeholder="Название игры, например Rust" autocomplete="off">
      <button class="btn primary" id="addGame">Добавить</button></div>
    <div class="note" id="addNote" style="padding:0">Поле подсказывает игры, по которым
      дропсы идут прямо сейчас. Любую другую можно добавить заранее — сканер сам
      заметит, когда по ней откроется кампания.</div></div>`;

  wireGames();
}

function wireGames() {
  const more = $("wlMore");
  if (more) more.onclick = () => { wlOpen = true; paintGames(); };
  $("addGame").onclick = () => addGame($("newGame"), $("addNote"), renderGames);
  $("newGame").onkeydown = (e) => { if (e.key === "Enter") $("addGame").click(); };
  hintGames($("newGame"));

  $("gamesBody").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    await fetch("/api/watchlist/" + b.dataset.rm, { method: "DELETE" });
    renderGames();
  });

  const apply = $("wlApply");
  if (apply) apply.onclick = async () => {
    apply.textContent = "Пересчёт…";
    planCache = await get("/api/replan", { method: "POST" });
    wlDirty = wlPreview = null;
    paintGames();
  };
  const undo = $("wlUndo");
  if (undo) undo.onclick = async () => {
    // одна ступень назад: возвращаем строку туда, откуда её взяли
    await moveGame(wlDirty.game_id, wlDirty.from, { remember: false });
    wlDirty = wlPreview = null;
    renderGames();
  };

  $("gamesBody").querySelectorAll("[data-grip]").forEach(grip => {
    grip.onmousedown = (e) => startDrag(e, grip.dataset.grip);
  });

  /* Номер вписывается руками. Перетаскивание хорошо, когда игру двигаешь
     на соседнее место; «поставь эту седьмой» мышью — это прицеливание,
     а пальцем в клавиатуру то же самое делается за секунду. */
  $("gamesBody").querySelectorAll("[data-pos]").forEach(field => {
    const was = field.value;
    const go = () => {
      const n = parseInt(field.value, 10);
      const from = wlRows.findIndex(g => g.game_id === field.dataset.pos) + 1;
      // мусор, пусто, вне списка, то же самое — молча возвращаем как было:
      // ругаться на опечатку в поле из двух символов не за что
      if (!Number.isInteger(n) || n < 1 || n > wlRows.length || n === from) {
        field.value = was;
        return;
      }
      moveGame(field.dataset.pos, n);
    };
    field.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); field.blur(); }
      if (e.key === "Escape") { field.value = was; field.blur(); }
    };
    field.onblur = go;
    field.onfocus = () => field.select();
    // строка вся тащится за ручку — но если тянуть за поле, курсор ставится
    // в текст, а не начинается перетаскивание. Так и надо
    field.onmousedown = (e) => e.stopPropagation();
  });
  $("gamesBody").querySelectorAll("[data-row]").forEach(row => {
    row.onkeydown = (e) => {
      if (!e.altKey) return;
      const from = wlRows.findIndex(g => g.game_id === row.dataset.row);
      let to = null;
      if (e.key === "ArrowUp") to = from - 1;
      if (e.key === "ArrowDown") to = from + 1;
      if (e.key === "Home") to = 0;
      if (to === null || to < 0 || to >= wlRows.length) return;
      e.preventDefault();
      moveGame(row.dataset.row, to + 1).then(() => {
        const again = $("gamesBody").querySelector(`[data-row="${row.dataset.row}"]`);
        if (again) again.focus();
      });
    };
  });
}

/* Сохранить порядок. `remember` — запоминать ли, откуда взяли: нужно для
   «Отмены», но не нужно самой «Отмене», иначе она отменяла бы себя. */
async function moveGame(gameId, position, { remember = true } = {}) {
  const from = wlRows.findIndex(g => g.game_id === gameId);
  const [moved] = wlRows.splice(from, 1);
  wlRows.splice(position - 1, 0, moved);
  if (remember && (!wlDirty || wlDirty.game_id !== gameId)) {
    wlDirty = { game_id: gameId, from: from + 1 };
  }
  paintGames();
  await fetch(`/api/watchlist/${gameId}/move/${position}`, { method: "POST" });
  if (remember) await wlLoadPreview();
}

/* Перетаскивание. Строку не двигаем — двигается линия вставки: так видно,
   куда она встанет, и ничего не прыгает под курсором. */
function startDrag(event, gameId) {
  event.preventDefault();
  const list = $("wlList");
  const lifted = $("gamesBody").querySelector(`[data-row="${gameId}"]`);
  if (!list || !lifted) return;
  const from = wlRows.findIndex(g => g.game_id === gameId);
  const total = wlRows.length;

  list.classList.add("dragging");
  lifted.classList.add("lifted");
  // номер теперь поле ввода: писать надо в `value`, иначе «1→3» не покажется
  const counter = lifted.querySelector(".num");
  counter.value = `${from + 1}→${from + 1}`;

  const line = document.createElement("div");
  line.className = "drop-line";
  line.innerHTML = `<i></i><i></i><b></b>`;
  let target = from;

  function place(clientY) {
    const rows = [...list.querySelectorAll(".wr")];
    target = rows.length - 1;
    for (const [i, row] of rows.entries()) {
      const box = row.getBoundingClientRect();
      if (clientY < box.top + box.height / 2) { target = i; break; }
    }
    const rows2 = [...list.querySelectorAll(".wr")];
    const anchor = rows2[target];
    line.querySelector("b").textContent = wlPlace(target + 1, total);
    counter.value = `${from + 1}→${target + 1}`;
    if (target >= rows2.length - 1 && clientY > anchor.getBoundingClientRect().bottom) {
      anchor.after(line);
    } else {
      anchor.before(line);
    }
  }

  place(event.clientY);

  const onMove = (e) => place(e.clientY);
  const finish = async (save) => {
    removeEventListener("mousemove", onMove);
    removeEventListener("mouseup", onUp);
    removeEventListener("keydown", onKey);
    line.remove();
    list.classList.remove("dragging");
    lifted.classList.remove("lifted");
    if (save && target !== from) await moveGame(gameId, target + 1);
    else paintGames();
  };
  const onUp = () => finish(true);
  const onKey = (e) => { if (e.key === "Escape") finish(false); };

  addEventListener("mousemove", onMove);
  addEventListener("mouseup", onUp);
  addEventListener("keydown", onKey);
}

async function renderGames() {
  wlRows = await get("/api/watchlist");
  wlOpen = wlRows.length <= WL_HEAD;
  $("screenName").textContent = "Мои игры";
  $("screenStamp").textContent = wlRows.length
    ? `${wlRows.length} ${plural(wlRows.length, "игра", "игры", "игр")}` : "";
  screenActions(`<button class="btn sm" id="wlReset">Сбросить порядок</button>`);
  $("wlReset").onclick = async () => {
    // сброс — это порядок добавления: он и есть «я ничего не расставлял»
    const было = wlRows.map(g => g.game_id).join();
    const заново = [...wlRows].sort((a, b) => a.added.localeCompare(b.added));
    if (заново.map(g => g.game_id).join() === было) return;
    for (const [i, g] of заново.entries()) {
      await fetch(`/api/watchlist/${g.game_id}/move/${i + 1}`, { method: "POST" });
    }
    wlDirty = { game_id: заново[0].game_id, from: 1 };
    await renderGames();
    await wlLoadPreview();
  };
  paintGames();
}

/* ---------- Инвентарь ----------
   Два источника в одном экране, и это главное, что про него надо знать:
   награды приходят из инвентаря Twitch, а часы и доля эфира — из нашей базы,
   в инвентаре их нет вовсе. Раньше экран показывал только забранное самой
   «Вахтой» — у Ксена это ноль записей при 137 наградах на аккаунте.

   Награды — плоским списком, без группировки по играм: Twitch не говорит,
   к какой игре относится награда, `game` у всех до единой пустой. Игра
   подставляется только там, где награда сошлась с известной кампанией
   по id benefit'а. Таблица игр осталась плоской, как в макете: строка
   отвечает «сколько», а «что именно забрано» уходит в правую колонку. */
let invData = null;
let invPick = null;   // game_id раскрытой игры
let invSaved = "";    // что сказать про последний экспорт: сноска переживает перерисовку

async function renderInventory() {
  invData = await get("/api/inventory");
  invPick = null;
  invSaved = "";
  // Открытый экран — это и есть «увидел»: снимаем отметку сразу, но уже после
  // того, как забрали данные, иначе новое исчезло бы, не показавшись
  if (invData.totals.new) {
    fetch("/api/inventory/seen", { method: "POST" }).then(() => {
      const t = $("tallyInv");
      t.hidden = true;
    });
  }
  $("screenAside").textContent = "что уже получено и сколько это стоило эфира";
  screenActions(`<button class="btn sm" id="invExport">Экспорт в CSV</button>
    ${lastShell.server_mode ? "" : '<button class="btn sm" id="invFolder">Открыть папку data</button>'}`);
  $("invExport").onclick = exportInventory;
  if ($("invFolder")) $("invFolder").onclick = () => fetch("/api/data/open", { method: "POST" });
  paintInventory();
}

function paintInventory() {
  const t = invData.totals;
  const rewards = invData.rewards || [];
  // порядок — по эфиру: полоса «доля эфира» иначе читалась бы вразнобой
  const games = [...invData.games].sort((a, b) => b.minutes - a.minutes);
  const top = Math.max(1, ...games.map(g => g.minutes));
  /* Подсказки для поля «игра»: всё, что «Вахта» и так знает про этот аккаунт.
     Списка игр Twitch тут нет намеренно — награда почти всегда из той игры,
     которая уже где-то в инвентаре засветилась. */
  const known = [...new Set([...games.map(g => g.name),
                             ...rewards.map(r => r.game).filter(Boolean)])].sort();

  $("invBody").innerHTML = `
    <div class="summary four">
      <div class="cell"><b>${t.rewards}</b><small>наград на аккаунте</small></div>
      <div class="cell"><b>${hours(t.minutes)}</b><small>эфира отфармлено</small></div>
      <div class="cell"><b>${t.games}</b><small>${plural(t.games, "игра", "игры", "игр")}</small></div>
      <div class="cell"><b>${hours(t.minutes_week)}</b><small>за последние 7 дней</small></div>
    </div>

    ${rewards.length ? `<div class="sect"><div class="label">награды с twitch${
        t.new ? `<span class="state ok"><i class="dot"></i>${t.new} ${
          plural(t.new, "новая", "новые", "новых")}</span>` : ""}</div>
      <span class="s">всё, что аккаунт получил за всё время — и до «Вахты» тоже.
        Игру Twitch у наград не отдаёт: она появляется там, где награда сошлась
        с кампанией, которую «Вахта» видела. Остальное можно вписать руками —
        обходы такую пометку не сотрут</span></div>
      <div class="grid rew">
      <div class="gh"><span>награда</span><span>игра</span><span>получена</span><span>всего</span></div>
      <datalist id="invGames">${known.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
      ${rewards.map(r => `<div class="gr${r.new ? " fresh" : ""}">
        <div class="camp">${art("xs", r.name, r.image, r.id)}
          <span class="t">${esc(r.name)}</span>${
            r.new ? `<span class="mark">новое</span>` : ""}</div>
        <input class="pub${r.game ? "" : " none"}${r.by_hand ? " hand" : ""}"
          list="invGames" data-reward="${esc(r.id)}" value="${esc(r.game)}"
          placeholder="—" autocomplete="off" spellcheck="false"
          title="${r.by_hand ? "вписано руками — сотри, чтобы вернуть автоматику"
                             : "Twitch игру не отдаёт — впиши, если помнишь"}">
        <span class="dl">${
          // с годом: в инвентаре лежат награды за все годы, и «12.03» без него
          // читается как «в этом марте». Дата есть у всех 137 наград Ксена,
          // но обещать её Twitch не обязан — отсюда прочерк
          r.at ? new Date(r.at).toLocaleDateString("ru-RU") : "—"}</span>
        <span class="dl">${r.count > 1 ? "×" + r.count : "1"}</span></div>`).join("")}</div>`
      : `<div class="nothing"><div class="void">
          <h2>Пока пусто</h2>
          <p>Здесь появится всё, что выдал Twitch: награды приходят в инвентарь
             аккаунта, а не в «Вахту», — поэтому список честный даже за то время,
             когда «Вахты» ещё не было.</p>
          <div class="hint">фарм работает и с пустым инвентарём</div></div></div>`}

    ${games.length ? `<div class="sect"><div class="label">сколько это стоило</div>
      <span class="s">часов эфира и доли времени в инвентаре Twitch нет — это наше</span></div>
      <div class="grid inv">
      <div class="gh"><span>игра</span><span>доля эфира</span><span>часы</span><span>дропы</span></div>
      ${games.map(g => `<div class="gr ${g.game_id === invPick ? "on" : ""}"
        data-game="${esc(g.game_id)}" role="button" tabindex="0">
        <div class="camp">${art("xs", g.name, g.box_art, g.game_id)}
          <span class="t">${esc(g.name)}</span></div>
        <div class="share"><div class="bar2"><i style="width:${
          Math.max(2, Math.round(g.minutes / top * 100))}%"></i></div></div>
        <span class="dl">${hours(g.minutes)}</span>
        <span class="dl">${g.drops}</span></div>`).join("")}</div>` : ""}

    <div class="foot-note${invData.stale ? " warn" : ""}" id="invFoot">${invSaved
      || (invData.stale
        ? `twitch не ответил — показываю свою копию из data/vahta.db${
            invData.at ? ", последний раз обновлена " + hhmm(invData.at) : ""}`
        : `своя копия инвентаря${invData.at ? " · обновлена " + hhmm(invData.at) : ""} ·
           часы и доля эфира — только наши`)}</div>`;

  $("rail").innerHTML = invPick ? invRail(games.find(g => g.game_id === invPick)) : "";

  $("invBody").querySelectorAll("[data-game]").forEach(row => {
    const pick = () => {
      invPick = invPick === row.dataset.game ? null : row.dataset.game;
      paintInventory();
    };
    row.onclick = pick;
    row.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
  });

  /* Игра, вписанная руками. Автоматика знает её только у наград из кампаний,
     которые «Вахта» видела, — у Ксена это 20 из 137. Остальное помнит человек,
     и его пометка сильнее нашей подстановки. */
  $("invBody").querySelectorAll("[data-reward]").forEach(field => {
    const was = field.value;
    field.onfocus = () => field.select();
    field.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); field.blur(); }
      if (e.key === "Escape") { field.value = was; field.blur(); }
    };
    field.onblur = async () => {
      if (field.value.trim() === was.trim()) return;
      const answer = await (await fetch(
        `/api/inventory/${encodeURIComponent(field.dataset.reward)}/game`,
        { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ game: field.value.trim() }) })).json();
      if (!answer.ok) { field.value = was; return; }
      // стёртая пометка возвращает подстановку — какую именно, знает служба
      const row = invData.rewards.find(r => r.id === field.dataset.reward);
      if (row) { row.game = answer.game; row.by_hand = answer.by_hand; }
      paintInventory();
      $("invFoot").textContent = answer.by_hand
        ? "Игра вписана. Обходы её не сотрут — сотри поле, чтобы вернуть автоматику"
        : "Пометка снята — игра снова подставляется по кампаниям";
    };
  });
}

function invRail(g) {
  if (!g) return "";
  return `<div class="rail-in"><div class="box">
    <div class="label">${esc(g.name)}</div>
    <p>${g.drops} ${plural(g.drops, "дроп", "дропа", "дропов")} за ${hours(g.minutes)} эфира,
       ${g.campaigns} ${plural(g.campaigns, "кампания", "кампании", "кампаний")}.</p>
    <div style="margin-top:12px">${g.claims.map(c => `<div class="taken">
      <span class="grow">${esc(c.name)} · ${esc(c.campaign)}</span>
      <span class="at">${clock(c.at)}</span></div>`).join("")
      || `<div class="taken"><span class="grow">часы есть, дропов пока нет</span></div>`}
    </div>
    <p>Здесь только то, что забрала сама «Вахта»: когда именно и какой ценой.
       Что у тебя есть — в списке наград слева.</p></div></div>`;
}

async function exportInventory() {
  const b = $("invExport");
  b.textContent = "Сохраняю…";
  try {
    const data = await saveInventory();
    invSaved = lastShell.server_mode ? `скачано · ${data.name}` : `сохранено · data/${data.name} · ${data.rows} ${
      plural(data.rows, "строка", "строки", "строк")}`;
  } catch {
    invSaved = "не вышло сохранить файл — папка data занята или закрыта на запись";
  }
  b.textContent = "Экспорт в CSV";
  $("invFoot").textContent = invSaved;
}

async function saveInventory() {
  const r = await fetch('/api/inventory/export', {method: 'POST'});
  if (!r.ok) throw new Error('Не удалось выгрузить инвентарь');
  if (!lastShell.server_mode) return r.json();
  const blob = await r.blob();
  const name = /filename="?([^";]+)"?/.exec(r.headers.get('Content-Disposition') || '')?.[1] || 'inventory.csv';
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return {name, rows: invData?.rewards?.length || 0};
}

/* ---------- Каталог ----------
   Одна таблица на все фильтры: привязка — это колонка, а не отдельный режим
   с группировкой по играм. Так в макете, и так честнее — «без привязки»
   отвечает на вопрос «что открыть на сайте издателя», а не «какие игры
   сломаны». Поиск и фильтры лежат в шапке экрана. */
let catFilter = "linkable";
let catQuery = "";
let catRows = null;   // кампании каталога плюс игры из списка без кампаний
let catAt = "";       // когда был последний обход каталога

const SOON = 48 * 60;  // мин: кампания кончается меньше чем через двое суток

async function renderCatalog() {
  const [data, watch] = await Promise.all([get("/api/campaigns"), get("/api/watchlist")]);
  const rows = data.campaigns.map(c => ({ ...c }));
  // Игра из списка, по которой сейчас нет ни одной кампании. Без такой строки
  // фильтр «в списке» терял бы её молча, а это читается как «не заметил».
  // Привязка у неё неизвестна: она приходит с кампанией, а кампании нет.
  const seen = new Set(rows.map(c => c.game_id));
  for (const g of watch) {
    if (seen.has(g.game_id)) continue;
    rows.push({ game_id: g.game_id, game: g.name, box_art: g.box_art, name: "",
                publisher: "", ends_at: "", linked: null, watched: true });
  }
  rows.sort((a, b) => a.game.localeCompare(b.game, "ru") || a.name.localeCompare(b.name, "ru"));
  catRows = rows;
  catAt = data.at || "";

  const counts = {
    linkable: rows.filter(c => c.linked).length,
    unlinked: rows.filter(c => c.linked === false).length,
    watched: rows.filter(c => c.watched).length,
    all: rows.length,
  };
  const chip = (key, text) => `<button class="btn sm${catFilter === key ? " on" : ""}"
    data-filter="${key}">${text} <span style="color:var(--faint)">${counts[key]}</span></button>`;

  screenActions(`<div class="search">
      <input id="catSearch" placeholder="Поиск по игре, кампании или издателю"
        autocomplete="off" value="${esc(catQuery)}">
      <button class="clear" id="catClear"${catQuery ? "" : " hidden"}>× очистить</button></div>
    ${chip("linkable", "Доступны мне")}${chip("unlinked", "Без привязки")}${
      chip("watched", "В списке")}${chip("all", "Все")}`);
  $("screenActions").classList.add("wide");
  $("headGap").hidden = true;

  const chips = $("screenActions").querySelectorAll("[data-filter]");
  chips.forEach(b => b.onclick = () => {
    catFilter = b.dataset.filter;
    chips.forEach(x => x.classList.toggle("on", x === b));
    paintCatalog();
  });
  const search = $("catSearch");
  search.oninput = () => {
    catQuery = search.value;
    $("catClear").hidden = !catQuery;
    paintCatalog();
  };
  $("catClear").onclick = () => {
    catQuery = search.value = "";
    $("catClear").hidden = true;
    search.focus();
    paintCatalog();
  };

  paintCatalog();
}

/* Перерисовка без запроса: и фильтр, и поиск идут по уже полученным строкам.
   Трогает только таблицу — поле поиска живёт в шапке и фокус не теряет. */
function paintCatalog() {
  if (!catRows) return;
  const q = catQuery.trim().toLowerCase();
  const shown = catRows.filter(c =>
    (catFilter === "all" || (catFilter === "linkable" ? c.linked
      : catFilter === "unlinked" ? c.linked === false : c.watched))
    && (!q || `${c.game} ${c.name} ${c.publisher}`.toLowerCase().includes(q)));

  const note = catFilter === "linkable"
    ? `«Доступны мне» — кампании, где игровой аккаунт уже привязан к этому Twitch:
       только они реально фармятся.`
    : catFilter === "unlinked"
    ? `«Без привязки» — то, что открывается за пять минут на сайте издателя. Пока
       аккаунт не привязан, Twitch не засчитывает просмотр вообще: счётчик стоит на нуле.`
    : "";

  $("catBody").innerHTML = shown.length ? `
    <div class="grid cat">
      <div class="gh"><span>игра / кампания</span><span>издатель</span><span>до</span>
        <span>привязка</span><span></span></div>
      ${shown.map(catRow).join("")}</div>
    ${note ? `<div class="note-under">${note}</div>` : ""}
    <div class="foot-note">показано ${shown.length} из ${catRows.length}${
      catAt ? ` · последний обход ${hhmm(catAt)}` : ""}</div>`
    : catEmpty(catQuery.trim());

  wireCatalog();
}

function catRow(c) {
  const ends = c.ends_at ? dmy(c.ends_at) : "—";
  const soon = c.ends_at && (+new Date(c.ends_at) - Date.now()) / 60000 < SOON;
  const link = c.link_url || c.details_url;
  const bind = c.linked === null ? `<span class="state">—</span>`
    : c.linked ? `<span class="state ok">привязан</span>`
    : `<span class="state warn">нет · <a class="ln" href="${esc(link)}" target="_blank"
         rel="noopener">ссылка →</a></span>`;
  const sub = !c.name ? `<span class="s">активных кампаний нет</span>`
    : c.linked === false
    ? `<span class="s warn">${esc(c.name)} · без привязки прогресс не пойдёт</span>`
    : `<span class="s">${esc(c.name)}</span>`;
  return `<div class="gr">
    <div class="camp">${art("xs", c.game, c.box_art, c.game_id)}
      <div style="min-width:0"><div class="t">${esc(c.game)}</div>${sub}</div></div>
    <span class="pub">${esc(c.publisher)}</span>
    <span class="dl${soon ? " soon" : ""}">${ends}</span>
    ${bind}
    ${c.watched ? `<span class="state on">в списке</span>`
      : `<button class="state" data-watch="${esc(c.game)}">следить</button>`}</div>`;
}

function catEmpty(q) {
  const linkable = catRows.filter(c => c.linked).length;
  return `<div class="nothing"><div class="void">
    <h2>Ничего не нашёл</h2>
    <p>${q
      ? `По запросу «${esc(q)}» активных кампаний нет — ни среди ${linkable} доступных,
         ни среди ${catRows.length} всех. Возможно, кампания уже закончилась или ещё
         не открылась.`
      : `В этом фильтре пусто. Каталог знает ${catRows.length}
         ${plural(catRows.length, "кампанию", "кампании", "кампаний")}, из них
         ${linkable} с привязанным аккаунтом.`}</p>
    <div class="acts">
      ${q ? `<button class="btn primary" data-watch="${esc(q)}">Добавить в мои игры и ждать</button>` : ""}
      <button class="btn" id="catReset">Сбросить фильтры</button></div>
    <div class="hint">игру можно добавить заранее — обход сам заметит,
      когда по ней откроется кампания</div></div></div>`;
}

function wireCatalog() {
  const reset = $("catReset");
  if (reset) reset.onclick = () => {
    catFilter = "all";
    catQuery = "";
    renderCatalog();
  };
  $("catBody").querySelectorAll("[data-watch]").forEach(b => b.onclick = async () => {
    const was = b.textContent;
    b.textContent = "добавляю…";
    const r = await fetch("/api/watchlist", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ game: b.dataset.watch }) });
    if (r.ok) { renderCatalog(); return; }
    const data = await r.json().catch(() => ({}));
    b.textContent = was;
    alert(data.error || "Не вышло");
  });
}

/* ---------- Настройки ----------
   Один экран, шесть панелей: слева то, что связывает с чужими сервисами,
   справа — что настраивается внутри, риск и данные во всю ширину. Всё
   состояние приходит четырьмя запросами разом и рисуется один раз: раньше
   карточки дописывали себя по очереди, и каждая правка требовала помнить,
   кто чей `insertAdjacentHTML` испортит. */
let setCode = null;      // последний код входа: нужен, чтобы показать истёкший
let setNote = "";        // что сказать про экспорт — переживает перерисовку

async function renderSettings() {
  const [tw, app, tg] = await Promise.all([
    get("/api/twitch"), get("/api/settings"), get("/api/telegram"),
  ]);
  if (tw.pending) setCode = tw.pending;

  $("screenAside").textContent = app.server_mode ? "служба работает на сервере" : "всё лежит на этом компьютере, в папке data";
  $("setBody").innerHTML = `<div class="set">
    <div class="col">${twitchPanel(tw)}${telegramPanel(tg)}${notifyPanel(app)}</div>
    <div class="col">${windowPanel(app)}${farmPanel(app)}</div></div>
    <div class="pnl warn"><div class="label">риск, который надо назвать</div>
      <p>Автоматизация просмотра формально противоречит условиям Twitch. Гарантий,
         что аккаунт не заблокируют, нет ни у одной такой программы — держи ферму
         на отдельном аккаунте. Twitch меняет внутренние интерфейсы, и программа
         временами ломается — следи за релизами на GitHub.</p></div>
    <div class="pnl"><div class="line">
      <div class="grow"><div class="label">данные</div>
        <p>Токен, история и статистика эфира лежат ${app.server_mode ? "на сервере, в папке" : "в папке"}
           <span class="num">data</span> и никуда не отправляются.</p></div>
      ${app.server_mode ? '<button class="btn" id="serverLogout">Выйти из панели</button>' : '<button class="btn" id="setFolder">Открыть папку</button>'}
      <button class="btn" id="setExport">Экспорт инвентаря</button></div>
      <div class="foot-note" id="setFoot">${setNote}</div></div>
    ${updatePanel(app, lastShell)}`;

  wireSettings();
}

function twitchPanel(tw) {
  const on = !!tw.login;
  const state = on ? `<span class="state ok"><i class="dot"></i>подключён</span>`
    : tw.pending ? `<span class="state warn"><i class="dot"></i>ждёт кода</span>`
    : tw.error ? `<span class="state bad"><i class="dot"></i>код не подтверждён</span>`
    : `<span class="state"><i class="dot"></i>не подключён</span>`;

  let body;
  if (on) {
    body = `<div class="line"><span class="avatar">${esc(initials(tw.login))}</span>
        <div class="grow"><h3>${esc(tw.login)}</h3>
          <div class="sub">id ${esc(tw.user_id)} · вход по коду, пароль не хранится</div></div>
        <button class="btn sm" id="twOut">Выйти</button></div>
      <p>Держи отдельный аккаунт под ферму: если смотреть Twitch тем же аккаунтом
         параллельно, прогресс дропов рассинхронится.</p>`;
  } else if (tw.pending) {
    body = `<p>Открой <a class="lnk" href="${esc(tw.pending.verification_uri)}"
        target="_blank" rel="noopener">${esc(tw.pending.verification_uri)}</a> и введи код.
        Пароль здесь не вводится и не хранится.</p>
      <div class="codebox"><b>${esc(tw.pending.user_code)}</b>
        <div class="s">код живёт до ${hhmm(tw.pending.expires_at)} · жду подтверждения,
          экран обновится сам</div></div>`;
  } else if (tw.error) {
    // экран из login-error.png, но внутри карточки: отдельное окно — это вторая
    // поверхность со своим хозяйством, а сказать тут нужно ровно то же самое
    body = `<h3>${/истёк/i.test(tw.error) ? "Время на ввод кода вышло" : "Вход не прошёл"}</h3>
      <p>${/истёк/i.test(tw.error)
        ? `Код живёт десять минут. Похоже, страница Twitch не была открыта или
           подтверждение не дошло — программа ничего не сохранила, пароль она
           и не спрашивает.`
        : esc(tw.error)}</p>
      ${setCode ? `<div class="codebox dead"><b>${esc(setCode.user_code)}</b>
        <div class="s">истёк ${hhmm(setCode.expires_at)} ·
          ${esc(setCode.verification_uri.replace(/^https?:\/\//, ""))}</div></div>` : ""}
      <div class="label" style="margin-top:18px">что проверить</div>
      <ol class="steps">
        <li>Открыта ли страница twitch.tv/activate в браузере</li>
        <li>Тот ли аккаунт, который ты держишь под ферму</li>
        <li>Не блокирует ли соединение VPN или файрвол</li></ol>
      <div class="acts"><button class="btn primary" id="twIn">Получить новый код</button></div>`;
  } else {
    body = `<p>Без входа фарм не работает. Twitch выдаст короткий код, его нужно ввести
        на его же сайте — пароль здесь не вводится и не хранится.</p>
      <div class="acts"><button class="btn primary" id="twIn">Войти в Twitch</button></div>`;
  }
  return `<div class="pnl"><div class="label">аккаунт twitch ${state}</div>${body}</div>`;
}

function telegramPanel(tg) {

       <button class="btn sm" id="tgForget">Забыть</button></div>`
    : `<div class="field">
         <input id="tgToken" type="password" autocomplete="off" placeholder="1234567890:AA…">

  return `<div class="pnl"><div class="label">окно и тема</div>
    <div class="chips" id="themePick">
      ${[["system", "Как в системе"], ["dark", "Тёмная"], ["light", "Светлая"]].map(
