<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вахта</title>
<style>
  /* Токены из design/tokens.md.
     Тему разрешает JS и вешает атрибутом, а не @media: выбор «как в системе /
     тёмная / светлая» иначе потребовал бы светлый список дважды — раз для
     медиа-запроса, раз для выбора руками, — и два списка однажды разошлись бы. */
  :root, :root[data-theme="dark"] {
    --bg:#100e17; --titlebar:#0c0a12; --sidebar:#0e0c14;
    --panel:#141120; --panel-head:#151220; --panel-active:#171320; --raised:#1c1826;
    --line:#282235; --line-soft:#201b2b; --line-inner:#221d2e;
    --ink:#efe9f7; --ink-2:#c8c2d8; --dim:#8c85a0; --faint:#6b6482; --disabled:#4a4360;
    --accent:#a970ff; --accent-ink:#e2d4ff; --accent-bg:#2a1f45;
    --accent-line:#4d3a78; --accent-soft:#2b2140;
    --ok:#4ade80; --ok-ink:#7ee2a8; --ok-bg:#12251b; --ok-line:#26543a;
    --warn:#f0b429; --warn-ink:#e8d9b0; --warn-bg:#181409; --warn-line:#3a3020;
    --danger:#ff6b8b; --danger-ink:#e8a9b8; --danger-bg:#1a1219;
    --danger-row:#1c1419; --danger-line:#3d2531;
    --track:#241f33;
    /* тень ровно у двух вещей: поднятой при перетаскивании строки и
       всплывающего окна. У карточек теней нет — так в макетах */
    --lift:0 12px 28px rgba(0,0,0,.55);
  }
  :root[data-theme="light"] {
    --bg:#faf8fc; --titlebar:#f1edf7; --sidebar:#f4f1f9;
    --panel:#ffffff; --panel-head:#f6f3fb; --panel-active:#faf8fc; --raised:#e9e4f2;
    --line:#e7e1f0; --line-soft:#f0ebf7; --line-inner:#e2dbee;
    --ink:#1b1622; --ink-2:#3d3650; --dim:#6b647d; --faint:#7a7389; --disabled:#a49db5;
    --accent:#7c3aed; --accent-ink:#ffffff; --accent-bg:#f3edff;
    --accent-line:#d8ccf2; --accent-soft:#f3edff;
    --ok:#2e9e63; --ok-ink:#1f7a4c; --ok-bg:#eefaf2; --ok-line:#c4e6d2;
    --warn:#a06d0c; --warn-ink:#5c4a1b; --warn-bg:#fdf9ec; --warn-line:#f0e0b8;
    --danger:#d1436a; --danger-ink:#a8365a; --danger-bg:#fdf2f5;
    --danger-row:#fdf2f5; --danger-line:#f2c9d5;
    --track:#ece5f7;
    --lift:0 12px 28px rgba(28,24,38,.18);
  }
  :root {
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --ui: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  /* Пульт диспетчера, а не страница: окно поделено на полосы, прокручивается
     не оно целиком, а каждая колонка у себя. */
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:var(--ui); font-size:15px; line-height:1.55;
         display:flex; flex-direction:column; overflow:hidden; }
  h1,h2,h3 { margin:0; text-wrap:balance; }
  button { font:inherit; color:inherit; cursor:pointer; }
  input { font:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }

  /* --- своя титульная строка ------------------------------------------------
     Видна только в своём окне: класс framed вешается, когда нашёлся мост
     pywebview. В браузере (запасной путь, когда WebView2 не поднялся) строки
     нет — там заголовок, кнопки и всё остальное свои, браузерные. */
  .titlebar { display:none; }
  .framed .titlebar {
    display:flex; flex:none; height:34px;
    background:var(--titlebar); border-bottom:1px solid var(--line);
    align-items:stretch; user-select:none;
  }
  .tb-grab { display:flex; align-items:center; gap:9px; padding-left:12px; flex:1 1 auto; min-width:0; }
  .tb-grab .mark { width:14px; height:14px; flex:none; }
  .tb-grab .mark rect { fill:var(--dim); }
  .tb-grab .mark .mid { fill:var(--accent); }
  .tb-name { font-family:var(--mono); font-size:10.5px; letter-spacing:.24em;
             text-transform:uppercase; color:var(--ink-2); white-space:nowrap; }
  .tb-btns { display:flex; flex:none; }
  .tb-btn { width:44px; border:0; background:none; display:grid; place-items:center;
            color:var(--ink-2); transition:background .09s linear, color .09s linear; }
  .tb-btn:hover { background:var(--raised); color:var(--ink); }
  .tb-btn:focus-visible { outline-offset:-3px; }
  .tb-btn.close:hover { background:#e81123; color:#fff; }
  .tb-btn svg { width:10px; height:10px; fill:none; stroke:currentColor; stroke-width:1.2; }

  /* --- свои полосы прокрутки ------------------------------------------------
     Только через ::-webkit-scrollbar: стоит задать рядом стандартные
     scrollbar-width или scrollbar-color — и Chromium перестанет читать эти
     правила целиком, оставив системную полосу. Движок у нас всегда Chromium,
     так что выбор в пользу того, что даёт нарисовать полосу целиком.

     scrollbar-gutter обязателен. В Windows полосы по умолчанию прячутся сами
     и всплывают от движения мыши, а размеченная полоса, в отличие от
     системной накладной, занимает место в разметке. Без резерва содержимое
     дёргалось бы на её ширину каждый раз, когда мышь шевельнулась. */
  .work, .side-nav, .rail { scrollbar-gutter:stable; }
  ::-webkit-scrollbar { width:11px; height:11px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { border-radius:999px; border:3px solid transparent;
                              background:var(--line-inner); background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background-color:var(--dim); }
  ::-webkit-scrollbar-corner { background:transparent; }

  /* В своём окне текст не выделяется: это интерфейс, а не страница. Выделять
     дают там, где это осмысленно — поля ввода и то, что копируют руками. */
  .framed body { user-select:none; cursor:default; }
  .framed input, .framed textarea, .framed .code, .framed .sel { user-select:text; cursor:auto; }

  .label { font-family:var(--mono); font-size:10.5px; font-weight:600;
           letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .num { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* --- оболочка ------------------------------------------------------------
     Сайдбар 196 · работа · правая колонка 316 · статусная строка 28 снизу.
     Правая колонка пока пуста: её наполняют экраны, а они переписываются
     в 1.2.3 — до тех пор `:empty` её просто не показывает. */
  .shell { flex:1 1 auto; display:flex; min-height:0; }
  /* Фон у прокручиваемых колонок обязателен, хотя он и совпадает с фоном
     страницы. Chromium уводит такую колонку на свой слой композитора, а на
     прозрачном слое субпиксельное сглаживание текста невозможно — движок
     молча переходит на серое, начертание меняется, и буквы будто дёргаются
     при первых же движениях мыши. Свой непрозрачный фон это снимает. */
  .work { flex:1 1 auto; min-width:0; overflow-y:auto; background:var(--bg); }
  .rail { width:316px; flex:none; overflow-y:auto; background:var(--sidebar);
          border-left:1px solid var(--line); }
  .rail:empty { display:none; }
  .app { padding:22px 24px 40px; }

  .head { display:flex; align-items:flex-end; gap:14px; margin-bottom:20px; }
  .head h1 { font-family:var(--mono); font-size:16px; font-weight:500;
             letter-spacing:.14em; text-transform:uppercase; }
  .head .spacer { flex:1 1 auto; }
  .stamp { font-family:var(--mono); font-size:10px; letter-spacing:.22em;
           text-transform:uppercase; color:var(--faint); margin-bottom:5px; }
  /* подпись рядом с заголовком: не всякому экрану есть что сказать о себе,
     пустая — не занимает места */
  .head .aside { font-size:13.5px; color:var(--dim); margin-bottom:3px; }
  .head .aside:empty { display:none; }

  /* --- экран «Сейчас» ------------------------------------------------------ */
  .shift-card { border:1px solid var(--line); border-radius:10px; background:var(--panel);
                padding:16px 18px; display:flex; gap:16px; align-items:center; }
  .shift-card.paused { background:var(--panel); }
  .shift-body { flex:1 1 auto; min-width:0; }
  .shift-top { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .shift-top h3 { font-size:19px; font-weight:600; }
  .shift-top .sub { font-size:12.5px; color:var(--dim); }
  .shift-top .spacer { flex:1 1 auto; }
  .track { height:6px; border-radius:3px; background:var(--track); overflow:hidden; }
  .track i { display:block; height:100%; border-radius:3px; background:var(--accent);
             transition:width 1s linear; }
  .track.dim i { background:var(--disabled); }
  .under { display:flex; justify-content:space-between; gap:12px; margin-top:9px;
           font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
           text-transform:uppercase; color:var(--faint); font-variant-numeric:tabular-nums; }
  .said { font-size:13px; color:var(--dim); margin-top:10px; }

  .board { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .board-h { display:flex; align-items:baseline; gap:12px; padding:0 0 10px; }
  .board-h .label { font-size:10px; letter-spacing:.22em; }
  .board-h .aside { font-size:12.5px; color:var(--dim); font-family:var(--ui);
                    text-transform:none; letter-spacing:0; }
  .day { display:flex; gap:12px; align-items:center; padding:8px 16px;
         background:var(--panel-head); border-bottom:1px solid var(--line-soft);
         font-family:var(--mono); font-size:9.5px; letter-spacing:.22em;
         text-transform:uppercase; color:var(--faint); }
  .slot { display:flex; align-items:center; gap:14px; padding:12px 16px;
          border-bottom:1px solid var(--line-soft); background:var(--panel);
          transition:background .09s linear; }
  .slot:last-child { border-bottom:0; }
  .slot:hover { background:var(--panel-active); }
  .slot.on { background:var(--panel-active); }
  .slot.bad { background:var(--danger-row); }
  .slot .when { width:118px; flex:none; font-family:var(--mono); font-size:11.5px;
                font-variant-numeric:tabular-nums; color:var(--ink-2); }
  .slot .when small { display:block; font-size:9.5px; letter-spacing:.18em;
                      text-transform:uppercase; color:var(--faint); margin-top:2px; }
  .slot .mark { width:8px; height:8px; border-radius:50%; flex:none;
                background:var(--disabled); }
  .slot.on .mark { background:var(--accent); }
  .slot.bad .mark { background:var(--danger); }
  .slot .grow { flex:1 1 auto; min-width:0; }
  .slot .t { font-size:13.5px; font-weight:400; }
  .slot.on .t { font-weight:600; }
  .slot .s { font-size:12px; color:var(--dim); }
  .state { flex:none; font-family:var(--mono); font-size:10px; letter-spacing:.14em;
           text-transform:uppercase; color:var(--faint); }
  .state.on { color:var(--accent); }
  .state.warn { color:var(--warn); }
  .state.bad { color:var(--danger); }

  .warn-box { border:1px solid var(--warn-line); background:var(--warn-bg);
              border-radius:10px; padding:14px 16px; }
  .warn-box .label { color:var(--warn); }
  .warn-box p { margin:8px 0 0; font-size:13.5px; line-height:1.55; color:var(--warn-ink); }

  .void { max-width:520px; margin:9vh auto 0; }
  .void .mark { width:34px; height:34px; color:var(--disabled); display:block; margin-bottom:22px; }
  .void h2 { font-family:var(--mono); font-size:17px; font-weight:500; letter-spacing:.14em;
             text-transform:uppercase; margin-bottom:14px; }
  .void p { margin:0 0 20px; font-size:13.5px; line-height:1.6; color:var(--dim); }
  .void .hint { font-family:var(--mono); font-size:10px; letter-spacing:.18em;
                text-transform:uppercase; color:var(--faint); margin-top:14px; }

  /* --- экран «Расписание» -------------------------------------------------- */
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
             background:var(--line-inner); border:1px solid var(--line);
             border-radius:10px; overflow:hidden; margin-bottom:22px; }
  .cell { background:var(--panel); padding:15px 18px 16px; }
  .cell b { display:block; font-family:var(--mono); font-size:26px; font-weight:400;
            line-height:1.1; margin:8px 0 6px; font-variant-numeric:tabular-nums; }
  .cell small { font-size:12.5px; color:var(--dim); }
  .cell.bad b { color:var(--danger); } .cell.warn b { color:var(--warn); }

  .grid { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .gh, .gr { display:grid; align-items:center;
             grid-template-columns:150px 1fr 190px 118px 88px; }
  .gh { padding:9px 16px; background:var(--panel-head); border-bottom:1px solid var(--line);
        font-family:var(--mono); font-size:9.5px; letter-spacing:.22em;
        text-transform:uppercase; color:var(--faint); }
  .gr { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line-soft);
        transition:background .09s linear; }
  .gr:last-child { border-bottom:0; }
  .gr:hover { background:var(--panel-active); }
  .gr.on { background:var(--panel-active); }
  .gr.bad { background:var(--danger-row); }
  .gr .win { font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
             font-variant-numeric:tabular-nums; }
  .gr.bad .win { color:var(--danger); text-transform:uppercase; letter-spacing:.12em;
                 font-size:10px; }
  .gr .camp { display:flex; align-items:center; gap:11px; min-width:0; padding-right:16px; }
  .gr .camp .t { font-size:14px; }
  .gr.on .camp .t { font-weight:600; }
  .gr .camp .s { font-size:12.5px; color:var(--dim); overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .gr .camp .s.warn { color:var(--warn); }
  .slack { display:flex; align-items:center; gap:11px; padding-right:16px; }
  .slack .bar2 { flex:1 1 auto; height:4px; border-radius:2px; background:var(--track); }
  .slack .bar2 i { display:block; height:100%; border-radius:2px; background:var(--ok); }
  .slack.tight .bar2 i { background:var(--warn); }
  .slack.over .bar2 i { background:var(--danger); }
  .slack em { flex:none; font-style:normal; font-family:var(--mono); font-size:11px;
              color:var(--ok-ink); font-variant-numeric:tabular-nums; }
  .slack.tight em { color:var(--warn); } .slack.over em { color:var(--danger); }
  .slack.none em { color:var(--disabled); }
  .gr .dl { font-family:var(--mono); font-size:11.5px; color:var(--ink-2);
            font-variant-numeric:tabular-nums; }
  .note-under { font-size:13px; line-height:1.6; color:var(--dim); margin-top:18px; }

  /* --- экран «Мои игры» ----------------------------------------------------
     Всё движение отсюда расписано в design/notes.md по шагам. Ничего не
     двигается дольше 180 мс, масштаб не меняется, строка не «поднимается»
     при простом наведении. */
  .wl { border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .wh, .wr { display:grid; align-items:center;
             grid-template-columns:30px 46px 1fr 210px 106px 74px; }
  .wh { padding:9px 16px; background:var(--panel-head); border-bottom:1px solid var(--line);
        font-family:var(--mono); font-size:9.5px; letter-spacing:.22em;
        text-transform:uppercase; color:var(--faint); }
  .wr { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line-soft);
        border-radius:8px; transition:background .09s linear; }
  .wr:last-child { border-bottom:0; }
  .wr:hover { background:var(--panel-active); }
  .wl.dragging .wr { opacity:.72; }
  .wr.lifted { opacity:1; position:relative; z-index:2; background:var(--accent-soft);
               box-shadow:var(--lift); border:1px solid var(--accent-line); }

  .grip { width:14px; height:16px; border:0; background:none; padding:0; cursor:grab;
          color:var(--disabled); display:grid; place-items:center; }
  .wr:hover .grip { color:var(--dim); }
  .grip:hover { color:var(--accent); }
  .wr.lifted .grip { cursor:grabbing; color:var(--accent); }
  .grip svg { width:8px; height:12px; fill:currentColor; }

  .wr .num { font-family:var(--mono); font-size:12px; color:var(--faint);
             font-variant-numeric:tabular-nums; }
  .wr.lifted .num { color:var(--accent); }
  /* Номер — поле ввода, а выглядит как номер: перетаскивание удобно, когда
     двигаешь соседей, а «поставь эту седьмой» мышью означает целиться. */
  input.num { width:34px; padding:3px 0; border:1px solid transparent; border-radius:6px;
              background:none; text-align:left; -moz-appearance:textfield; }
  input.num::-webkit-inner-spin-button { display:none; }
  .wr:hover input.num { border-color:var(--line); color:var(--dim); }
  input.num:focus { outline:none; border-color:var(--accent); color:var(--fg);
                    background:var(--panel-active); text-align:center; }
  .wr .who2 { display:flex; align-items:center; gap:11px; min-width:0; padding-right:16px; }
  .wr .who2 .t { font-size:14px; }
  .wr .who2 .s { font-size:12px; color:var(--warn); }
  .wr .who2 .s.dim { color:var(--dim); }
  .air { display:flex; align-items:center; gap:11px; padding-right:16px; }
  .air .bar2 { flex:1 1 auto; height:4px; border-radius:2px; background:var(--track); }
  .air .bar2 i { display:block; height:100%; border-radius:2px; background:var(--ok); }
  .air.thin .bar2 i { background:var(--warn); }
  .air.none .bar2 i { width:0; }
  .air em { flex:none; font-style:normal; font-family:var(--mono); font-size:10.5px;
            letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2);
            font-variant-numeric:tabular-nums; }
  .air.none em { color:var(--faint); }
  .drop-line { display:flex; align-items:center; gap:10px; height:2px; margin:0 16px;
               position:relative; }
  .drop-line i { flex:1 1 auto; height:2px; background:var(--accent); border-radius:1px; }
  .drop-line i:first-child { flex:none; width:6px; height:6px; border-radius:50%; }
  .drop-line b { flex:none; font-family:var(--mono); font-size:9.5px; font-weight:400;
                 letter-spacing:.2em; text-transform:uppercase; color:var(--accent); }
  .wl-tail { padding:13px 16px; background:var(--panel-head); font-family:var(--mono);
             font-size:10px; letter-spacing:.14em; text-transform:uppercase;
             color:var(--faint); cursor:pointer; border:0; width:100%; text-align:left; }
  .wl-tail:hover { color:var(--ink-2); }
  .price { display:flex; justify-content:space-between; gap:14px; padding:7px 0;
           border-bottom:1px solid var(--line-soft); font-size:13.5px; }
  .price:last-of-type { border-bottom:0; }
  .price em { font-style:normal; font-family:var(--mono); font-size:12px;
              font-variant-numeric:tabular-nums; color:var(--dim); }
  .price em.up { color:var(--ok-ink); } .price em.down { color:var(--danger); }

  /* --- Гант: главный вид «Расписания» ---------------------------------------
     Пропорции в процентах, а не в пикселях: окно тянут, а сетка суток должна
     оставаться на своих местах. Полосы пересекаются намеренно — эфир делится,
     и толщина полосы это и показывает. */
  .gantt { margin:0 0 20px; padding:14px 0 0; background:var(--panel);
           border:1px solid var(--line-soft); border-radius:12px; overflow:hidden; }
  .gan-r { display:grid; grid-template-columns:minmax(120px,210px) 1fr; align-items:center;
           gap:14px; padding:0 16px; height:30px; }
  .gan-r:hover { background:var(--panel-active); }
  .gan-h { height:24px; margin-bottom:6px; }
  .gan-h:hover { background:none; }
  .gan-h .gan-n { font-family:var(--mono); font-size:9.5px;
                  letter-spacing:.22em; text-transform:uppercase; color:var(--faint); }
  .gan-n { display:flex; align-items:center; gap:9px; min-width:0; }
  .gan-n .t { font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gan-t { position:relative; height:100%; }
  .gan-h .gan-t { border-bottom:1px solid var(--line-soft); }
  .bar { position:absolute; top:50%; transform:translateY(-50%); border-radius:3px;
         background:var(--accent); opacity:.82; min-width:2px; }
  .bar:hover { opacity:1; }
  .bar.on { background:var(--ok); }
  .bar.warn { background:var(--warn); }
  .bar.bad { background:var(--danger); }
  /* дедлайн — штрих поперёк строки: он про «когда сгорит», а не про длительность */
  .dl-mark { position:absolute; top:3px; bottom:3px; width:0; border-left:2px dotted var(--danger); }
  .tick { position:absolute; top:0; bottom:0; width:1px; background:var(--line-soft); }
  .tick-t { position:absolute; bottom:2px; transform:translateX(-50%); font-style:normal;
            font-family:var(--mono); font-size:9.5px; color:var(--faint);
            font-variant-numeric:tabular-nums; }
  .tick-t.now { left:0; transform:none; letter-spacing:.14em; color:var(--accent); }
  .gan-none { font-family:var(--mono); font-size:10px; letter-spacing:.14em;
              text-transform:uppercase; color:var(--danger); }
  .gan-legend { padding:12px 16px 13px; margin-top:8px; line-height:1.65;
                font-size:12.5px; color:var(--dim);
                border-top:1px solid var(--line-soft); background:var(--panel-head); }

  /* --- экран «Каталог» ------------------------------------------------------
     Таблица та же, что у «Расписания» (.grid/.gh/.gr) — другие колонки.
     Поиск и фильтры живут в шапке экрана, как в макете: строка одна. */
  /* колонки сжимаются: при 900 px (минимальная ширина окна) фиксированные
     съедали название игры до полутора букв */
  .grid.cat .gh, .grid.cat .gr {
    grid-template-columns:minmax(190px,1fr) minmax(84px,190px) 88px minmax(118px,176px) 96px; }
  .grid.cat .camp .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grid.cat .pub { font-size:13.5px; color:var(--ink-2); padding-right:16px;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grid.cat .dl.soon { color:var(--danger); }
  /* последняя колонка прижата вправо: там действие, а не значение */
  .grid.cat .gh > :last-child, .grid.cat .gr > :last-child { justify-self:end; }
  .ln { font-family:var(--mono); font-size:10px; letter-spacing:.14em;
        text-transform:uppercase; color:inherit; text-decoration:none; }
  .ln:hover { text-decoration:underline; }
  .state.ok { color:var(--ok); }
  button.state { border:0; background:none; padding:0; }
  button.state:hover { color:var(--accent); }

  /* строка одна: при нехватке места ужимается поиск, а не фильтры —
     переносить чипы значило бы двигать всю таблицу вниз */
  .head .chips.wide { flex:1 1 auto; margin-left:6px; align-items:stretch; flex-wrap:nowrap; }
  .head .chips.wide .btn { flex:none; }
  .search { display:flex; align-items:center; gap:10px; flex:1 1 auto; min-width:120px;
            background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:0 13px; height:34px; }
  .search:focus-within { border-color:var(--accent-line); }
  .search input { flex:1 1 auto; min-width:0; background:none; border:0; padding:0;
                  color:inherit; font-size:13.5px; }
  .search input:focus { outline:none; }
  .search input::placeholder { color:var(--faint); }
  .search .clear { border:0; background:none; padding:0; white-space:nowrap;
                   font-family:var(--mono); font-size:10px; letter-spacing:.14em;
                   text-transform:uppercase; color:var(--faint); }
  .search .clear:hover { color:var(--ink-2); }
  .search .clear[hidden] { display:none; }

  .nothing { border:1px solid var(--line); border-radius:10px; background:var(--panel);
             padding:56px 44px; }
  .nothing .void { margin:0 auto; }
  .void .acts { display:flex; gap:10px; margin-bottom:16px; }
  .foot-note { font-family:var(--mono); font-size:10px; letter-spacing:.2em;
               text-transform:uppercase; color:var(--faint); margin-top:16px; }

  /* --- экран «Инвентарь» ----------------------------------------------------
     Те же .grid и .summary, что у «Расписания»: колонки другие, всё остальное
     общее. Полоса «доля эфира» — от самой отфармленной игры, а не от суммы:
     сравнивают глазами именно с первой строкой.

     Две таблицы, потому что и источника два: игры с часами — наши, награды —
     из инвентаря Twitch. Награды плоским списком, без группировки по играм:
     Twitch не говорит, к какой игре относится награда (`game` у всех пустой). */
  .summary.four { grid-template-columns:repeat(4,1fr); }
  .summary.four .cell b { margin-top:0; }
  .grid.inv .gh, .grid.inv .gr {
    grid-template-columns:minmax(160px,1fr) minmax(140px,430px) 88px 72px; }
  .grid.rew .gh, .grid.rew .gr {
    grid-template-columns:minmax(180px,1fr) minmax(120px,240px) 108px 56px; }
  .grid.inv .camp .t, .grid.rew .camp .t {
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grid.rew .pub { font-size:13.5px; color:var(--ink-2); padding-right:16px;
                   overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grid.rew .pub.none { color:var(--faint); }
  /* Игра у награды вписывается руками — поле выглядит текстом, пока в него
     не целятся: Twitch игру не отдаёт, и у большинства наград тут прочерк,
     который не должен выглядеть как сто пустых форм */
  input.pub { width:100%; min-width:0; margin:-3px 0; padding:3px 7px;
              border:1px solid transparent; border-radius:6px; background:none;
              font-family:inherit; }
  .grid.rew .gr:hover input.pub { border-color:var(--line); }
  input.pub:focus { outline:none; border-color:var(--accent); color:var(--fg);
                    background:var(--panel); }
  /* вписанное руками — пунктиром: видно, что это не подстановка */
  input.pub.hand { text-decoration:underline dotted var(--line); text-underline-offset:3px; }
  /* «новое» — награда, которой не было при прошлом открытии экрана. Метка
     у названия, а не отдельная колонка: колонка стояла бы пустой месяцами */
  .grid.rew .gr.fresh { background:var(--accent-soft); }
  .grid.rew .mark { flex:none; font-family:var(--mono); font-size:9.5px;
                    letter-spacing:.14em; text-transform:uppercase;
                    color:var(--accent); }
  .foot-note.warn { color:var(--warn); }
  /* картинка награды — не бокс-арт: она квадратная и лежит на прозрачном фоне,
     поэтому и размер квадратный, и `cover` ей не нужен — режет предмет */
  .grid.rew .art { width:28px; height:28px; border-radius:6px; background:var(--track); }
  .grid.rew .art img { object-fit:contain; }
  .sect { display:flex; align-items:baseline; gap:12px; margin:26px 0 12px; }
  /* flex — ради знака «2 новые» рядом с подписью: без него он прилипал
     к последней букве, как «twitch2 новые» */
  .sect .label { display:flex; align-items:center; gap:10px; margin:0; flex:none; }
  .sect .s { font-size:13px; color:var(--dim); }
  .share { padding-right:26px; }
  .share .bar2 { height:4px; border-radius:2px; background:var(--track); }
  .share .bar2 i { display:block; height:100%; border-radius:2px; background:var(--accent); }

  /* --- экран «Настройки» ----------------------------------------------------
     Два столбца, как в макете: слева то, что связывает с чужими сервисами,
     справа — что настраивается внутри. Риск и данные — во всю ширину. */
  /* Два столбца — flex, а не grid: у сетки панели выравниваются по строкам,
     и под низкой панелью остаётся дыра во всю высоту соседней. */
  .set { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
  .set .col { flex:1 1 360px; min-width:0; display:flex; flex-direction:column; gap:18px; }
  .pnl { border:1px solid var(--line); border-radius:10px; background:var(--panel);
         padding:19px 21px 21px; }
  .pnl > .label { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .pnl h3 { font-size:16px; font-weight:600; }
  .pnl p { margin:14px 0 0; font-size:13.5px; line-height:1.55; color:var(--dim); }
  .pnl .line { display:flex; align-items:center; gap:14px; }
  .pnl .line + .line { margin-top:15px; }
  .pnl .line .grow { flex:1 1 auto; min-width:0; }
  .pnl .sub { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
              text-transform:uppercase; color:var(--faint); margin-top:4px; }
  .pnl .acts { display:flex; gap:10px; margin-top:16px; }
  .pnl.warn { border-color:var(--warn-line); background:var(--warn-bg); }
  .pnl.warn > .label { color:var(--warn); }
  .pnl.warn p { color:var(--warn-ink); }
  .avatar { width:30px; height:30px; border-radius:7px; flex:none; display:grid;
            place-items:center; background:var(--accent-soft); color:var(--accent);
            font-family:var(--mono); font-size:11px; }
  .field { display:flex; gap:10px; margin-top:16px; }
  .field input { flex:1 1 auto; min-width:0; background:var(--bg); border:1px solid var(--line);
                 border-radius:8px; padding:9px 13px; color:inherit; font-size:13.5px; }
  .field input:focus { outline:none; border-color:var(--accent-line); }
  .field input::placeholder { color:var(--faint); }

  /* переключатель: в макете это тумблер, а не галочка */
  .sw { display:flex; align-items:center; gap:13px; cursor:pointer; }
  .sw input { position:absolute; opacity:0; width:0; height:0; }
  .sw i { width:38px; height:21px; border-radius:999px; flex:none; background:var(--track);
          border:1px solid var(--line-inner); position:relative;
          transition:background .12s linear, border-color .12s linear; }
  .sw i::after { content:""; position:absolute; top:2px; left:2px; width:15px; height:15px;
                 border-radius:50%; background:var(--disabled);
                 transition:transform .12s cubic-bezier(.2,0,.2,1), background .12s linear; }
  .sw input:checked + i { background:var(--accent-bg); border-color:var(--accent-line); }
  .sw input:checked + i::after { transform:translateX(17px); background:var(--accent); }
  .sw input:focus-visible + i { outline:2px solid var(--accent); outline-offset:2px; }
  .sw .s { font-size:12.5px; color:var(--dim); margin-top:2px; }

  .codebox { border:1px solid var(--line); border-radius:10px; background:var(--bg);
             padding:15px 17px; margin-top:16px; }
  .codebox b { display:block; font-family:var(--mono); font-size:25px; font-weight:400;
               letter-spacing:.22em; user-select:all; }
  .codebox .s { margin-top:9px; font-size:12.5px; color:var(--dim); }
  .codebox.dead { border-color:var(--danger-line); background:var(--danger-bg); }
  .codebox.dead b { color:var(--disabled); text-decoration:line-through; }
  .codebox.dead .s { color:var(--danger); }
  .steps { margin:14px 0 0; padding:0; list-style:none; counter-reset:step; }
  .steps li { font-size:13.5px; color:var(--ink-2); padding:3px 0; }
  .steps li::before { counter-increment:step; content:counter(step) " · ";
                      font-family:var(--mono); font-size:12px; color:var(--faint); }

  /* --- мастер первого запуска и тосты ---------------------------------------
     Мастер — накладка внутри своего же окна, а не второе окно: вторая
     поверхность тянет за собой позицию, фокус, тему и своё закрытие.
     Своя титульная строка остаётся сверху — окно должно оставаться окном. */
  .wiz { position:fixed; inset:0; z-index:20; background:var(--bg);
         display:flex; flex-direction:column; }
  .framed .wiz { top:34px; }
  .wiz-top { flex:none; display:flex; align-items:center; gap:11px; height:46px;
             padding:0 16px; background:var(--titlebar); border-bottom:1px solid var(--line); }
  .wiz-top .mark { width:13px; height:13px; flex:none; }
  .wiz-top .mark rect { fill:var(--dim); }
  .wiz-top .mark .mid { fill:var(--accent); }

  /* Ожидание ответа Twitch. Индикатор — тот же знак, что в трее, и работает он
     так же: средняя полоса это шкала. Там она показывает прогресс смены, здесь
     ходит туда-обратно, потому что сколько ждать — неизвестно. Своего спиннера
     в «Вахте» нет и не надо: знак уже есть и уже значит «идёт работа» */
  .wait { display:flex; align-items:center; gap:14px; padding:18px 0; color:var(--dim);
          font-size:13.5px; }
  .wait .mark { width:26px; height:26px; flex:none; }
  .wait .mark rect { fill:var(--disabled); }
  .wait .mark .mid { fill:var(--accent); transform-box:fill-box;
                     transform-origin:left center; animation:bar 1.15s ease-in-out infinite; }
  @keyframes bar { 0%,100% { transform:scaleX(.28) } 50% { transform:scaleX(1) } }
  @media (prefers-reduced-motion:reduce) {
    .wait .mark .mid { animation:none; transform:scaleX(.6) } }
  .wiz-top .spacer { flex:1 1 auto; }
  .wiz-top .skip { border:0; background:none; padding:6px 8px; font-family:var(--mono);
                   font-size:10px; letter-spacing:.16em; text-transform:uppercase;
                   color:var(--faint); }
  .wiz-top .skip:hover { color:var(--ink-2); }
  .wiz-body { flex:1 1 auto; overflow-y:auto; padding:26px 32px 16px; background:var(--bg); }
  .wiz-in { max-width:860px; margin:0 auto; }
  .wiz-steps { display:flex; gap:9px; margin-bottom:15px; }
  .wiz-steps i { flex:1 1 0; height:3px; border-radius:2px; background:var(--track); }
  .wiz-steps i.done { background:var(--accent); }
  .wiz-steps i.now { background:color-mix(in srgb,var(--accent) 55%,transparent); }
  .wiz h2 { font-size:25px; font-weight:650; margin:9px 0 13px; }
  .wiz-in > p { margin:0 0 9px; font-size:14px; line-height:1.6; color:var(--dim);
                max-width:74ch; }
  .wiz-foot { flex:none; display:flex; align-items:center; gap:11px; padding:13px 32px;
              background:var(--panel); border-top:1px solid var(--line); }
  .wiz-foot .hint { flex:1 1 auto; font-size:13px; color:var(--faint); }
  .wiz .grid { margin-top:20px; }
  .wiz .field, .wiz .set { margin-top:20px; }

  /* Тост живёт внутри окна, значит виден, только пока окно открыто. Родное
     уведомление Windows нужно ровно для обратного случая — они не замена
     друг другу. Правый нижний угол, над статусной строкой. */
  .toasts { position:fixed; right:15px; bottom:37px; z-index:30; display:flex;
            flex-direction:column; align-items:flex-end; gap:8px; pointer-events:none; }
  .toast { min-width:230px; max-width:330px; border:1px solid var(--line-inner);
           border-radius:10px; background:var(--raised); padding:12px 14px;
           box-shadow:var(--lift); animation:toast-in .14s cubic-bezier(.2,0,.2,1); }
  .toast .label { color:var(--accent); }
  .toast p { margin:7px 0 0; font-size:13px; line-height:1.5; color:var(--ink-2); }
  .toast.out { opacity:0; transition:opacity .2s linear; }
  @keyframes toast-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; } }
  @media (prefers-reduced-motion:reduce) { .toast { animation:none; } }

  /* правая колонка экрана «Сейчас» */
  .rail-in { padding:16px 16px 28px; display:flex; flex-direction:column; gap:16px; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line-inner);
           border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .tile { background:var(--panel); padding:14px 16px; }
  .tile b { display:block; font-family:var(--mono); font-size:22px; font-weight:400;
            line-height:1.1; font-variant-numeric:tabular-nums; margin-bottom:5px; }
  .tile small { font-size:11.5px; color:var(--dim); }
  .tile.bad b { color:var(--danger); }
  .tile.warn b { color:var(--warn); }
  .box { border-radius:10px; padding:14px 16px; border:1px solid var(--line); }
  .box.bad { border-color:var(--danger-line); background:var(--danger-bg); }
  .box.bad .label { color:var(--danger); }
  .box.warn { border-color:var(--warn-line); background:var(--warn-bg); }
  .box.warn .label { color:var(--warn); }
  .box p { margin:9px 0 0; font-size:13px; line-height:1.55; }
  .box.bad p { color:var(--ink); } .box.warn p { color:var(--warn-ink); }
  /* В правой колонке 316 px, а в подписи кнопки — название кампании: в строку
     они не помещаются и вылезали за панель. Столбиком и по левому краю. */
  .box .acts { display:flex; flex-direction:column; align-items:stretch;
               gap:8px; margin-top:13px; }
  .box .acts .btn { text-align:left; white-space:normal; }
  /* Вилка «что важнее»: те же кнопки столбиком, но отделённые от объяснения —
     сведение выше, выбор ниже. «Оставить как есть» набрано текстом, а не
     кнопкой: это то, что случится само. */
  .ask { margin-top:13px; border-top:1px solid var(--line); padding-top:12px; }
  .ask .label { font-size:10px; letter-spacing:.22em; margin-bottom:9px; }
  .ask .btn { display:block; width:100%; text-align:left; white-space:normal;
              margin-bottom:8px; }
  .ask p.sub { margin:2px 0 0; font-size:12px; line-height:1.5; }
  .taken { display:flex; align-items:center; gap:10px; padding:9px 0;
           border-bottom:1px solid var(--line-soft); font-size:13px; }
  .taken:last-child { border-bottom:0; }
  .taken .grow { flex:1 1 auto; min-width:0; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .taken .at { flex:none; font-family:var(--mono); font-size:10.5px; color:var(--faint);
               font-variant-numeric:tabular-nums; }

  .side { width:196px; flex:none; display:flex; flex-direction:column;
          background:var(--sidebar); border-right:1px solid var(--line); }
  .side-nav { flex:1 1 auto; overflow-y:auto; padding:10px 0; background:var(--sidebar); }
  .nav-item { display:flex; align-items:center; gap:10px; width:100%; background:none;
              border:0; padding:11px 18px; text-align:left; font-family:var(--mono);
              font-size:11px; letter-spacing:.16em; text-transform:uppercase;
              color:var(--dim); box-shadow:inset 2px 0 0 transparent; }
  .nav-item:hover { color:var(--ink-2); background:var(--panel-active); }
  .nav-item[aria-selected="true"] { color:var(--ink); background:var(--raised);
                                    box-shadow:inset 2px 0 0 var(--accent); }
  .nav-item .grow { flex:1 1 auto; }
  .tally { font-style:normal; font-size:10.5px; letter-spacing:.06em; color:var(--faint); }
  .tally.crit { color:var(--danger); }
  /* новое в инвентаре — не беда и не просто счётчик: цифра, на которую стоит
     нажать. Поэтому акцент, а не серый и не красный */
  .tally.new { color:var(--accent); }
  .tally[hidden], .live-dot[hidden] { display:none; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--ok); flex:none; }

  .side-foot { flex:none; padding:16px 18px 14px; border-top:1px solid var(--line); }
  .side-foot .shift { font-family:var(--mono); font-size:24px; line-height:1.1;
                      font-variant-numeric:tabular-nums; margin:7px 0 2px; }
  .side-foot .since { font-size:12px; color:var(--dim); }
  .who { display:flex; align-items:center; gap:9px; margin-top:14px;
         padding-top:12px; border-top:1px solid var(--line-soft); }
  .who i { width:26px; height:26px; border-radius:6px; flex:none; display:grid;
           place-items:center; background:var(--accent-soft); color:var(--accent);
           font-family:var(--mono); font-size:10px; font-style:normal; }
  .who span { font-size:13px; color:var(--ink-2); overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap; }

  .statusbar { flex:none; display:flex; align-items:center; gap:18px; height:28px;
               padding:0 14px; background:var(--titlebar); border-top:1px solid var(--line);
               font-family:var(--mono); font-size:9.5px; letter-spacing:.2em;
               text-transform:uppercase; color:var(--faint); user-select:none; }
  .statusbar .spacer { flex:1 1 auto; }
  .statusbar b { font-weight:400; color:var(--dim); }
  .statusbar .beat { width:5px; height:5px; border-radius:50%; background:var(--disabled);
                     display:inline-block; margin-right:7px; vertical-align:1px; }
  .statusbar.live .beat { background:var(--ok); }
  .statusbar .upd { color:var(--accent); text-decoration:none; }
  .statusbar .upd b { color:var(--accent); }
  .statusbar .upd:hover { text-decoration:underline; }
  .statusbar .upd[hidden] { display:none; }

  .pill { display:inline-flex; align-items:center; gap:7px; font-family:var(--mono);
          font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
          padding:5px 11px; border-radius:999px; border:1px solid transparent; white-space:nowrap; }
  .pill.live { background:var(--ok-bg); color:var(--ok);
               border-color:color-mix(in srgb,var(--ok) 30%,transparent); }
  .pill.mute { background:var(--raised); color:var(--dim); border-color:var(--line); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  /* единственная бесконечная анимация в интерфейсе — точка «в эфире» */
  .pill.live .dot, .statusbar.live .beat, .live-dot {
    animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
  @media (prefers-reduced-motion:reduce) {
    .pill.live .dot, .statusbar.live .beat, .live-dot { animation:none } }

  .pane { display:none; } .pane.on { display:block; }

  /* Общие мелочи, которыми пользуются все экраны. Всё, что осталось от старой
     вёрстки, ушло вместе с последним переписанным экраном — вместе со списком
     псевдонимов токенов в :root. */
  .stack { display:flex; flex-direction:column; gap:18px; }

  .art { flex:none; position:relative; overflow:hidden; border-radius:4px; background:var(--raised);
         display:grid; place-items:center; font-family:var(--mono); font-weight:700; color:var(--dim);
         box-shadow:inset 0 0 0 1px var(--line); }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .art.xs { width:24px; height:32px; font-size:8.5px; }
  .art.sm { width:34px; height:45px; font-size:11px; }
  .art.md { width:42px; height:56px; font-size:12px; }
  .art.lg { width:84px; height:112px; font-size:21px; border-radius:6px; }

  .btn { border:1px solid var(--line-inner); background:var(--panel); border-radius:7px;
         padding:8px 15px; font-size:13px; font-weight:550; white-space:nowrap; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.sm { padding:5px 11px; font-size:12px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { background:color-mix(in srgb,var(--accent) 84%,#000); color:#fff; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips .btn.on { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  .addrow { display:flex; gap:8px; }
  .addrow input { flex:1 1 auto; min-width:0; background:var(--raised); border:1px solid var(--line);
                  border-radius:7px; padding:8px 12px; color:inherit; }
  .note { font-size:12.5px; color:var(--dim); }
  .lnk { color:var(--accent); text-decoration:none; }
  .lnk:hover { text-decoration:underline; }

  .btn[disabled], input[disabled] { opacity:.45; cursor:not-allowed; }
  .btn[disabled]:hover { border-color:var(--line-inner); color:inherit; }

  /* Browser layout: desktop WebView keeps its original fixed-column shell. */
  @media (max-width:1100px) {
    .server body { height:auto; min-height:100dvh; overflow:auto; }
    .server .shell { display:grid; grid-template-columns:160px minmax(0,1fr); min-height:calc(100dvh - 28px); }
    .server .side { width:160px; grid-row:1 / 3; position:sticky; top:0; height:calc(100dvh - 28px); }
    .server .work { overflow:visible; scrollbar-gutter:auto; }
    .server .rail { grid-column:2; width:auto; overflow:visible; border-left:0; border-top:1px solid var(--line); }
    .server .statusbar { position:sticky; bottom:0; z-index:5; overflow-x:auto; white-space:nowrap; min-height:28px; }
    .server .statusbar > * { flex-shrink:0; }
    .server .grid, .server .wl { overflow-x:auto; max-width:100%; }
    .server .grid .gr { min-width:680px; }
    .server .wl .wr { min-width:700px; }
    .server .head { flex-wrap:wrap; }
  }
  @media (max-width:700px) {
    .server .shell { display:flex; flex-direction:column; }
    .server .side { width:100%; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); }
    .server .side-nav { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); padding:4px; overflow:visible; scrollbar-gutter:auto; }
    .server .nav-item { font-size:10px; letter-spacing:.06em; padding:12px 8px; gap:5px; }
    .server .side-foot { display:none; }
    .server .app { padding:18px 16px 24px; }
    .server .rail { width:100%; }
    .server .head { gap:10px; }
    .server h1 { font-size:24px; }
    .server .head .spacer { display:none; }
    .server .pnl .line { flex-wrap:wrap; }
    .server .statusbar { gap:14px; }
    .server .wiz-body { padding:20px 16px; }
    .server .shift-art { display:none; }
  }
</style>

<body>

  <!-- за эту половину окно таскают: класс ищет сам pywebview. Кнопки лежат
