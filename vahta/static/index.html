function updatePanel(s, shell) {
  if (s.server_mode) return `<div class="pnl"><div class="label">обновления</div>
    <p>Серверная ВАХТА обновляется пересборкой Docker-образа. Вход в Twitch, список игр и история сохраняются отдельно от приложения.</p></div>`;
  const waiting = shell.update_ready;
  const state = !s.auto_update ? `<span class="state">только плашка</span>`
    : waiting ? `<span class="state warn"><i class="dot"></i>ждёт паузы в фарме</span>`
    : `<span class="state ok"><i class="dot"></i>ставятся сами</span>`;
  return `<div class="pnl"><div class="label">обновления ${state}</div>
    <div class="line">${sw("updAuto", s.auto_update, "Ставить обновления самой",
      waiting ? `Версия ${shell.update} скачана — встанет между ломтями фарма`
              : "Тихо, без вопросов и без перезагрузки")}
      ${waiting ? `<button class="btn sm primary" id="updNow">Поставить сейчас</button>`
                : `<button class="btn sm" id="updCheck">Проверить</button>`}</div>
    <p id="updNote">${updSaid || `«Вахта» смотрит релизы на GitHub раз в шесть часов. Файл качается
      заранее и сверяется по хэшу, а ставится не сразу: посреди просмотра обновление
      стоило бы минут, которые Twitch не вернёт, — поэтому момент выбирается между
      ломтями фарма. Данные и вход в Twitch обновление не трогает.
      Выключишь — останется плашка в статусной строке, как раньше.`}</p></div>`;
}

/* Что ответила последняя проверка обновлений. Живёт снаружи панели, потому что
   панель перерисовывается после ответа — иначе ответ стирал бы сам себя. */
let updSaid = "";

const sw = (id, checked, title, sub) => `<label class="sw grow">
  <input type="checkbox" id="${id}"${checked ? " checked" : ""}><i></i>
  <span><div>${title}</div><div class="s">${sub}</div></span></label>`;

function wireSettings() {
  const save = async (patch) => {
    await fetch("/api/settings", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) });
    renderSettings();
  };
  const on = (id, go) => { const el = $(id); if (el) el.onclick = go; };

  if ($("ntfOn")) $("ntfOn").onchange = (e) => save({ notifications: e.target.checked });
  if ($("closeTray")) $("closeTray").onchange = (e) => save({ close_to_tray: e.target.checked });
  // порядок фарма меняется сразу, не дожидаясь получаса до пересборки плана
  $("farmLoose").onchange = async (e) => {
    await save({ farm_unlinked: e.target.checked });
    fetch("/api/replan", { method: "POST" });
  };
  if ($("updAuto")) $("updAuto").onchange = (e) => save({ auto_update: e.target.checked });

  /* Проверка руками. Обычно релизы смотрит фоновый круг раз в шесть часов,
     но ждать его, когда обновление вышло только что, незачем. Кнопка заодно и качает:
     ставить всё равно на границе ломтя, а качать в этот момент — значит его
     пропустить. Ответ может идти секунды (двадцать мегабайт), поэтому кнопка
     сразу говорит, что занята. */
  on("updCheck", async () => {
    const btn = $("updCheck");
    btn.textContent = "Проверяю…";
    btn.disabled = true;
    try {
      const r = await (await fetch("/api/update/check", { method: "POST" })).json();
      updSaid = esc(r.message);
    } catch (e) {
      updSaid = "Проверить не вышло — служба не ответила";
    }
    await renderSettings();
    tick();  // плашка в статусной строке знает про новую версию сразу
  });

  on("updNow", async () => {
    const btn = $("updNow");
    btn.textContent = "Запускаю…";
    btn.disabled = true;
    const r = await (await fetch("/api/update/install", { method: "POST" })).json();
    updSaid = esc(r.message);
    await renderSettings();
  });
  if ($("autoRun")) $("autoRun").onchange = (e) => save({ autostart: e.target.checked });
  on("serverLogout", async () => { await fetch('/auth/logout', {method: 'POST'}); location.replace('/auth/login'); });
  const winAuto = $("winAuto");
  if (winAuto) winAuto.onchange = (e) => save({ window_on_autostart: e.target.checked });

  $("themePick").querySelectorAll("button").forEach(b => b.onclick = () => {
    applyTheme(b.dataset.theme);  // не ждём службу: тема должна отзываться сразу
    save({ theme: b.dataset.theme });
  });

  on("ntfTest", async () => {
    const r = await (await fetch("/api/settings/test", { method: "POST" })).json();
    $("ntfNote").textContent = r.shown
      ? "Отправлено. Если ничего не появилось — глушит Windows: смотри «Фокусировку внимания» и параметры уведомлений."
      : "Показывать нечем: «Вахта» запущена без трея.";
  });

  wireTwitch(renderSettings);

  on("tgSave", async () => {
    const token = $("tgToken").value.trim();
    if (!token) return;
    $("tgSave").textContent = "Проверяю…";
    const r = await fetch("/api/telegram", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
    const data = await r.json();
    if (r.ok) {
      await renderSettings();
      $("tgNote").innerHTML = `Бот <b>@${esc(data.username)}</b> подключён.
        Теперь напиши ему <b>/start</b>.`;
    } else { $("tgSave").textContent = "Сохранить"; $("tgNote").textContent = data.error; }
  });
  on("tgForget", async () => {
    await fetch("/api/telegram", { method: "DELETE" });
    renderSettings();
  });

  on("setFolder", () => fetch("/api/data/open", { method: "POST" }));
  on("setExport", async () => {
    $("setExport").textContent = "Сохраняю…";
    try {
      const data = await saveInventory();
      setNote = lastShell.server_mode ? `скачано · ${data.name}` : `сохранено · data/${data.name} · ${data.rows} ${
        plural(data.rows, "строка", "строки", "строк")}`;
    } catch {
      setNote = "не вышло сохранить файл — папка data занята или закрыта на запись";
    }
    $("setExport").textContent = "Экспорт инвентаря";
    $("setFoot").textContent = setNote;
  });
}

/* Кнопки входа. Живут в двух местах — в настройках и в мастере первого
   запуска, — поэтому обвязка отдельно от них обоих и берёт, куда вернуться. */
function wireTwitch(after) {
  const inBtn = $("twIn"), outBtn = $("twOut");
  if (inBtn) inBtn.onclick = async () => {
    inBtn.disabled = true;
    inBtn.textContent = "Запрашиваю код…";
    try {
      const response = await fetch("/api/twitch/login", { method: "POST" });
      if (!response.ok) throw new Error("Сервер не смог запросить код. Обнови страницу и попробуй ещё раз.");
      await after();
    } catch (error) {
      let note = inBtn.parentElement.querySelector(".twitch-login-error");
      if (!note) {
        note = document.createElement("p");
        note.className = "twitch-login-error";
        note.setAttribute("role", "alert");
        inBtn.parentElement.appendChild(note);
      }
      note.textContent = error.message || "Нет связи с сервером. Попробуй ещё раз.";
    } finally {
      inBtn.disabled = false;
      inBtn.textContent = "Войти в Twitch";
    }
  };
  if (outBtn) outBtn.onclick = async () => {
    await fetch("/api/twitch/logout", { method: "POST" });
    setCode = null;
    after();
  };
  // код ждёт подтверждения — переспрашиваем службу сами
  if (setCode && !outBtn) setPoll(after);
}

/* Ожидание подтверждения кода: спрашиваем службу, пока она не ответит, что
   вход прошёл или что код истёк. Один таймер на окно. */
let loginPoll = null;
function setPoll(after) {
  if (loginPoll) return;
  loginPoll = setInterval(async () => {
    const tw = await get("/api/twitch").catch(() => null);
    if (!tw || tw.pending) return;
    clearInterval(loginPoll);
    loginPoll = null;
    after();
  }, 3000);
}

/* ---------- мастер первого запуска ----------
   Четыре шага в том порядке, в каком они друг от друга зависят: без входа
   не виден каталог, без списка игр нечего привязывать. В макете шаг привязки
   второй, но там список уже есть — а на пустой «Вахте» его сначала надо
   составить, иначе шаг показывал бы пустоту.

   Пропустить можно на любом шаге: мастер объясняет, а не сторожит. Ничего
   своего он не хранит — каждый шаг работает теми же ручками, что и экраны. */
const WIZ = ["Вход в Twitch", "Игры под фарм", "Привязка аккаунтов", "Как себя вести"];
let wizStep = 0;
let wizData = null;
let wizDone = false;  // сторож от повтора: не сохранилось — не наша беда окна

async function openWizard() {
  if ($("wiz")) return;
  const box = document.createElement("div");
  box.className = "wiz";
  box.id = "wiz";
  box.innerHTML = `<div class="wiz-top">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="6" y="7" width="20" height="4" rx="2" opacity=".32"></rect>
        <rect x="9" y="14" width="14" height="4" rx="2" class="mid"></rect>
        <rect x="12" y="21" width="8" height="4" rx="2" opacity=".32"></rect></svg>
      <span class="tb-name">первый запуск</span><span class="spacer"></span>
      <button class="skip" id="wizSkip">пропустить</button></div>
    <div class="wiz-body"><div class="wiz-in" id="wizIn"></div></div>
    <div class="wiz-foot"><span class="hint" id="wizHint"></span>
      <button class="btn" id="wizBack">Назад</button>
      <button class="btn primary" id="wizNext">Дальше</button></div>`;
  document.body.append(box);
  $("wizSkip").onclick = closeWizard;
  $("wizBack").onclick = () => { if (wizStep > 0) { wizStep--; paintWiz(); } };
  $("wizNext").onclick = () => {
    if (wizStep < WIZ.length - 1) { wizStep++; paintWiz(); } else closeWizard();
  };
  await paintWiz();
}

async function closeWizard() {
  wizDone = true;
  await fetch("/api/settings", { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ onboarded: true }) });
  const box = $("wiz");
  if (box) box.remove();
  planCache = null;
  tick();
}

async function paintWiz() {
  const [tw, watch, cat] = await Promise.all([
    get("/api/twitch"), get("/api/watchlist"),
    // каталог нужен только шагу привязки, и только когда до него дошли:
    // на первом шаге за ним ещё некому ходить — вход не сделан
    wizStep === 2 ? get("/api/campaigns").catch(() => ({ campaigns: [], at: "" }))
                  : Promise.resolve(null),
  ]);
  if (tw.pending) setCode = tw.pending;
  wizData = { tw, watch, cat };

  const app = await get("/api/settings");
  const body = [wizTwitch, wizGames, wizLink, wizHabits][wizStep](wizData, app);
  $("wizIn").innerHTML = `
    <div class="wiz-steps">${WIZ.map((_, i) =>
      `<i class="${i < wizStep ? "done" : i === wizStep ? "now" : ""}"></i>`).join("")}</div>
    <div class="stamp">шаг ${wizStep + 1} из ${WIZ.length}</div>
    ${body.html}`;
  $("wizHint").textContent = body.hint;
  $("wizBack").disabled = wizStep === 0;
  $("wizNext").textContent = wizStep === WIZ.length - 1 ? "Готово" : "Дальше";
  if (body.wire) body.wire();
}

function wizTwitch({ tw }) {
  return {
    hint: tw.login ? "Дропы падают в игровой аккаунт, привязанный к этому Twitch"
                   : "Можно пропустить, но без входа фарм не начнётся",
    html: `<h2>Войди в Twitch</h2>
      <p>Просмотр засчитывается тому аккаунту, под которым «Вахта» смотрит.
         Пароль здесь не вводится и не хранится: Twitch выдаёт короткий код,
         его нужно подтвердить на его же сайте.</p>
      <div class="set" style="max-width:520px">${twitchPanel(tw)}</div>`,
    wire: () => wireTwitch(paintWiz),
  };
}

/* Игры из инвентаря предлагаются списком, но не добавляются молча: вотчлист —
   это выбор человека, а не наша догадка. Зато искать в каталоге то, что уже
   фармится на его же аккаунте, — работа, которую мы можем не отдавать ему.

   Список грузится сам и после шага, а не вместе с ним: спросить Twitch — это
   секунда-две по сети, и держать ради неё весь шаг пустым нельзя. Пока ответа
   нет, на месте списка стоит знак «Вахты» со шкалой — тот же, что в трее.

   `wizInv` живёт между перерисовками: шаг рисуется заново на каждое добавление,
   а инвентарь за это время не меняется. */
let wizInv = null;   // ответ /api/inventory/games или null, пока не спросили

function wizGames({ watch, tw }) {
  // «сначала войди» устаревает ровно в тот момент, когда человек вошёл:
  // на прошлом шаге он это и сделал, и спросить надо заново
  if (wizInv && wizInv.needs_login && tw.login) wizInv = null;
  const mine = (wizInv ? wizInv.games : []).filter(g => !g.watched);
  return {
    hint: mine.length ? "Это игры, по которым на твоём аккаунте уже идёт прогресс"
                      : "Список можно менять когда угодно — на вкладке «Мои игры»",
    html: `<h2>Выбери игры под фарм</h2>
      <p>«Вахта» следит только за тем, что в списке: смотрит стримы с дропсами,
         считает эфир и раскладывает кампании по дедлайнам. Игру можно добавить
         заранее — обход сам заметит, когда по ней откроется кампания.</p>
      <div id="wizGamesBox">${wizMine(mine)}</div>
      <div class="label" style="margin-top:22px" id="wizManual">${
        mine.length ? "или добавь вручную" : "добавить игру"}</div>
      <div class="field" style="max-width:520px;margin-top:10px">
        <input id="wizGame" placeholder="Название игры, например Rust" autocomplete="off">
        <button class="btn${mine.length ? "" : " primary"}" id="wizAdd">Добавить</button></div>
      <div class="note" id="wizNote" style="margin-top:10px"></div>
      ${watch.length ? `<div class="grid" style="margin-top:18px">
        <div class="gh" style="grid-template-columns:1fr 90px">
          <span>в списке · ${watch.length}</span><span></span></div>
        ${watch.map(g => `<div class="gr" style="grid-template-columns:1fr 90px">
          <div class="camp">${art("xs", g.name, g.box_art, g.game_id)}
            <span class="t">${esc(g.name)}</span></div>
          <button class="state" data-drop="${esc(g.game_id)}">убрать</button></div>`).join("")}
        </div>` : ""}`,
    wire: () => {
      $("wizAdd").onclick = () => addGame($("wizGame"), $("wizNote"), paintWiz);
      $("wizGame").onkeydown = (e) => { if (e.key === "Enter") $("wizAdd").click(); };
      hintGames($("wizGame"));
      $("wizIn").querySelectorAll("[data-drop]").forEach(b => b.onclick = async () => {
        await fetch("/api/watchlist/" + b.dataset.drop, { method: "DELETE" });
        paintWiz();
      });
      wireMine(mine);
      if (!wizInv) loadWizGames();   // первый показ шага: идём спрашивать
    },
  };
}

/* Блок «уже фармится»: ожидание, беда с причиной или список. Отдельно от шага,
   потому что перерисовывается сам, когда придёт ответ. */
function wizMine(mine) {
  if (!wizInv) {
    return `<div class="wait">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="6" y="7" width="20" height="4" rx="2"></rect>
        <rect x="9" y="14" width="14" height="4" rx="2" class="mid"></rect>
        <rect x="12" y="21" width="8" height="4" rx="2"></rect></svg>
      <span>Смотрю, что уже фармится на твоём аккаунте…</span></div>`;
  }
  if (wizInv.needs_login) {
    return `<div class="note">Свои игры покажу после входа — он на прошлом шаге.
      Вручную добавить можно и без него.</div>`;
  }
  if (wizInv.error) {
    return `<div class="note">Не вышло спросить Twitch: ${esc(wizInv.error)}.
      <button class="state" id="wizRetry">попробовать снова</button></div>`;
  }
  if (!mine.length) {
    return `<div class="note">${wizInv.games.length
      ? "Всё, что фармится на аккаунте, уже в списке."
      : "На аккаунте пока нет кампаний в процессе — значит и предлагать нечего."}</div>`;
  }
  return `<div class="grid">
    <div class="gh" style="grid-template-columns:1fr 90px">
      <span>уже фармится на этом аккаунте · ${mine.length}</span>
      <button class="state" id="wizTakeAll">добавить все</button></div>
    ${mine.map(g => `<div class="gr" style="grid-template-columns:1fr 90px">
      <div class="camp">${art("xs", g.name, g.box_art, g.game_id)}
        <span class="t">${esc(g.name)}</span></div>
      <button class="state" data-take="${esc(g.game_id)}">добавить</button></div>`).join("")}
    </div>`;
}

function wireMine(mine) {
  const box = $("wizGamesBox");
  if (!box) return;
  const retry = $("wizRetry");
  if (retry) retry.onclick = () => { wizInv = null; paintWiz(); };
  const take = async (ids, b) => {
    const was = b.textContent;
    b.textContent = "добавляю…";
    const r = await fetch("/api/watchlist/inventory", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ game_ids: ids }) });
    const data = await r.json().catch(() => ({}));
    b.textContent = was;
    if (data.added) wizInv = null;  // добавленные ушли в список — спросим заново
    paintWiz();
  };
  box.querySelectorAll("[data-take]").forEach(b =>
    b.onclick = () => take([b.dataset.take], b));
  const all = $("wizTakeAll");
  if (all) all.onclick = () => take(mine.map(g => g.game_id), all);
}

async function loadWizGames() {
  // причину беды называет служба, полем `error`; сюда доходит только то, что
  // случилось по дороге к ней самой, и пересказывать её ответ целиком незачем
  const answer = await get("/api/inventory/games")
    .catch(() => ({ games: [], error: "служба не ответила" }));
  wizInv = answer;
  // шаг мог сменитьcя, пока мы ждали Twitch: тогда рисовать нечего
  if (wizStep === 1 && $("wizGamesBox")) {
    const mine = answer.games.filter(g => !g.watched);
    $("wizGamesBox").innerHTML = wizMine(mine);
    wireMine(mine);
    $("wizHint").textContent = mine.length
      ? "Это игры, по которым на твоём аккаунте уже идёт прогресс"
      : "Список можно менять когда угодно — на вкладке «Мои игры»";
    // ручной ввод из главного действия становится второстепенным: пришёл
    // список — добавлять руками уже незачем, но возможность остаётся
    $("wizManual").textContent = mine.length ? "или добавь вручную" : "добавить игру";
    $("wizAdd").classList.toggle("primary", !mine.length);
  }
}

/* Привязка одна на игру, а не на кампанию: у игры их бывает несколько,
   и привязанный аккаунт открывает прогресс сразу по всем. */
function wizLink({ watch, cat }) {
  const linked = new Map();
  for (const c of (cat ? cat.campaigns : [])) {
    const was = linked.get(c.game_id);
    linked.set(c.game_id, {
      linked: c.linked || (was && was.linked),
      url: (was && was.url) || c.link_url || c.details_url,
    });
  }
  const rows = watch.map(g => {
    const it = linked.get(g.game_id);
    const tail = !it ? `<span class="state">кампаний нет</span><span></span>`
      : it.linked ? `<span class="state ok">привязан</span>
          <span class="dl">${cat.at ? "проверено " + hhmm(cat.at) : ""}</span>`
      : `<span class="state warn">не привязан</span>
         <a class="btn sm" href="${esc(it.url)}" target="_blank" rel="noopener"
            style="text-decoration:none">Открыть сайт</a>`;
    return `<div class="gr" style="grid-template-columns:1fr 130px 130px">
      <div class="camp">${art("xs", g.name, g.box_art, g.game_id)}
        <span class="t">${esc(g.name)}</span></div>${tail}</div>`;
  }).join("");

  return {
    hint: "Можно пропустить — но по непривязанным играм прогресс будет ноль",
    html: `<h2>Привяжи игровые аккаунты</h2>
      <p>Twitch не начинает засчитывать просмотр, пока игровой аккаунт не привязан —
         счётчик так и стоит на нуле. Это делается на сайте издателя, один раз
         на игру.</p>
      ${watch.length ? `<div class="grid">${rows}</div>
        <div class="foot-note">привязку видно не сразу — Twitch обновляет её
          у себя, «Вахта» подхватит на ближайшем обходе</div>`
        : `<div class="nothing"><div class="void"><h2>Список пуст</h2>
            <p>Привязывать пока нечего: вернись на шаг назад и добавь игры.</p>
            </div></div>`}`,
  };
}

function wizHabits(_, app) {
  if (app.server_mode) return {hint: "Можно закрыть браузер — фарм продолжится",
    html: '<h2>ВАХТА работает на сервере</h2><p>Служба запускается вместе с сервером. Игры, прогресс и настройки доступны из этой панели. Telegram настраивается в разделе «Настройки».</p>', wire: () => {}};
  return {
    hint: "Всё это потом меняется в «Настройках»",
    html: `<h2>Как «Вахте» себя вести</h2>
      <p>Фарм идёт, пока запущена служба, — окно ему не нужно. Поэтому крестик
         по умолчанию убирает окно в трей, а не выходит.</p>
      <div class="set" style="max-width:560px"><div class="col"><div class="pnl">
        <div class="line">${sw("wizTray", app.close_to_tray,
          "Закрытие окна сворачивает в трей",
          "Иначе крестик закрывает «Вахту» целиком и фарм останавливается")}</div>
        <div class="line">${sw("wizRun", app.autostart, "Запускать вместе с Windows",
          "Ярлык в реестре пользователя, без прав администратора")}</div>
        <div class="line">${sw("wizNtf", app.notifications, "Показывать уведомления",
          "Забранные дропы, открывшиеся кампании, конфликты дедлайнов")}</div>
      </div></div></div>`,
    wire: () => {
      const save = async (patch) => {
        await fetch("/api/settings", { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) });
      };
      $("wizTray").onchange = (e) => save({ close_to_tray: e.target.checked });
      $("wizRun").onchange = (e) => save({ autostart: e.target.checked });
      $("wizNtf").onchange = (e) => save({ notifications: e.target.checked });
    },
  };
}

/* ---------- тосты ----------
   Служба копит ленту уведомлений, окно показывает то, чего ещё не видело.
   Первый опрос ничего не сыплет: иначе открытое окно встречало бы человека
   стопкой того, что случилось, пока оно было закрыто, — для этого есть
   центр уведомлений Windows. */
let seenEvent = null;

function showEvents(events) {
  if (!events) return;
  const last = events.length ? events[events.length - 1].id : 0;
  if (seenEvent === null) { seenEvent = last; return; }
  for (const e of events) {
    if (e.id <= seenEvent) continue;
    seenEvent = e.id;
    toast(e.title, e.text);
  }
}

function toast(title, text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<div class="label">${esc(title)}</div>
    <p>${esc(text).replace(/\n/g, "<br>")}</p>`;
  $("toasts").append(el);
  setTimeout(() => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 220);
  }, 4000);
}

/* ---------- своё окно ----------
   Всё ниже включается, только если под нами своё окно, а не браузер: мост
   pywebview появляется не сразу, поэтому либо он уже есть, либо ждём события. */
function framed(api) {
  document.documentElement.classList.add("framed");

  function showState(on) {
    document.documentElement.classList.toggle("maxed", on);
    const btn = $("tbMax");
    btn.title = on ? "Свернуть в окно" : "Развернуть";
    btn.setAttribute("aria-label", btn.title);
    // развёрнутому — два прямоугольника внахлёст, как у Windows
    $("tbMaxIcon").innerHTML = on
      ? '<rect x=".5" y="2.5" width="7" height="7" rx="1"></rect>' +
        '<path d="M2.5 2.5V.5h7v7h-2"></path>'
      : '<rect x=".5" y=".5" width="9" height="9" rx="1"></rect>';
  }

  const toggle = () => api.toggle_maximize().then(showState);
  $("tbMin").onclick = () => api.minimize();
  $("tbClose").onclick = () => api.close();
  $("tbMax").onclick = toggle;

  const grab = $("tbGrab");
  grab.ondblclick = toggle;
  // перетаскивание развёрнутого окна ничего хорошего не даёт: гасим нажатие
  // на перехвате, до того как до него доберётся обработчик pywebview
  grab.addEventListener("mousedown", (e) => {
    if (document.documentElement.classList.contains("maxed")) e.stopPropagation();
  }, true);

  // развернуть могут и мимо наших кнопок — Win+↑ или прилипанием к краю,
  // и тогда единственный сигнал, который до нас доходит, — изменение размера.
  // Спрашиваем не на каждое событие: пока окно тянут за край, их сотни, а
  // каждый вопрос — это ходка в Python и обратно
  let asking = 0;
  addEventListener("resize", () => {
    clearTimeout(asking);
    asking = setTimeout(() => api.is_maximized().then(showState), 120);
  });
  api.is_maximized().then(showState);

  // Верхние 8 px окна рисует не эта страница, а сама Windows: там рамка,
  // за которую окно тянут. Убрать её нельзя, но можно покрасить в цвет
  // титульной строки — тогда полоса перестаёт читаться как полоса.
  // Цвет отсюда, а не из Python: тема живёт в CSS, и второй список значений
  // однажды разошёлся бы с первым.
  onThemeChanged = function paintFrame() {
    const bar = document.querySelector(".titlebar");
    const rgb = (v) => (v.match(/\d+/g) || [0, 0, 0]).slice(0, 3).map(Number);
    const style = getComputedStyle(bar);
    api.set_frame_colors(rgb(style.backgroundColor), rgb(style.borderBottomColor));
  };
  onThemeChanged();

  // контекстное меню WebView2 — это «обновить» и «сохранить как»: в окне
  // программы им делать нечего. В полях ввода оно остаётся, там оно по делу
  addEventListener("contextmenu", (e) => {
    if (!e.target.closest("input, textarea, .code, .sel")) e.preventDefault();
  });
}
if (window.pywebview?.api) framed(window.pywebview.api);
else addEventListener("pywebviewready", () => framed(window.pywebview.api));

/* ---------- оболочка ---------- */
const tabs = document.querySelectorAll(".nav-item");
const panes = { now:"p-now", sched:"p-sched", games:"p-games", cat:"p-cat",
                inv:"p-inv", set:"p-set" };
tabs.forEach(t => t.onclick = () => {
  tabs.forEach(x => x.setAttribute("aria-selected", String(x === t)));
  Object.entries(panes).forEach(([k, id]) => $(id).classList.toggle("on", k === t.dataset.p));
  // шапку и правую колонку наполняет экран, а не оболочка: уходя, убираем за собой
  $("head").hidden = false;
  $("screenName").textContent = t.querySelector(".grow").textContent;
  $("screenStamp").textContent = "";
  $("screenAside").textContent = "";
  $("rail").innerHTML = "";
  $("screenActions").className = "chips";  // «Каталог» уходит с широкой шапкой
  $("headGap").hidden = false;
  if (t.dataset.p === "now") { tick(); return; }
  screenActions(`<button class="btn sm" id="refresh">Пересчитать</button>`);
  wireRefresh();
  if (t.dataset.p === "games") renderGames();
  if (t.dataset.p === "cat") renderCatalog();
  if (t.dataset.p === "inv") renderInventory();
  if (t.dataset.p === "set") renderSettings();
});

/* Тему выбирает человек, а хранит служба — значение приходит вместе с
   остальной оболочкой. «Как в системе» разрешается здесь: CSS знает только
   про dark и light, и это нарочно (см. комментарий к токенам). */
const systemDark = matchMedia("(prefers-color-scheme: dark)");
let themeChoice = "system";
let onThemeChanged = () => {};  // своё окно подставит сюда покраску рамки

function applyTheme(choice) {
  choice = choice || "system";
  const want = (choice === "system" ? systemDark.matches : choice === "dark")
    ? "dark" : "light";
  if (choice === themeChoice && want === document.documentElement.dataset.theme) return;
  themeChoice = choice;
  document.documentElement.dataset.theme = want;
  onThemeChanged();
}
systemDark.addEventListener("change", () => {
  document.documentElement.dataset.theme = "";  // чтобы applyTheme увидел разницу
  applyTheme(themeChoice);
});
// до первого ответа службы идём за системой: без этого светлая Windows
// смотрела бы на тёмное окно, а в браузерном запасном пути — всегда
applyTheme("system");

/* Часы смены идут сами, между опросами: служба присылает не строку «03:40»,
   а сколько секунд смена длится, — иначе цифра стояла бы по двадцать секунд. */
let shiftFrom = null;

function drawShift() {
  const live = shiftFrom !== null;
  $("shiftLabel").textContent = live ? "вахта идёт" : "вахта стоит";
  $("shiftNote").textContent = live ? "без обрывов" : "эфира нет";
  if (!live) { $("shiftClock").textContent = "00:00:00"; return; }
  const total = Math.max(0, Math.floor((Date.now() - shiftFrom) / 1000));
  const pad = (n) => String(n).padStart(2, "0");
  // Часы, минуты и секунды всегда, даже когда часов нет: «03:40» читалось
  // и как три часа сорок минут, и как три минуты сорок секунд, а по одной
  // цифре не угадать — раньше разряды переключались на часе работы
  $("shiftClock").textContent = `${pad(Math.floor(total / 3600))}:${
    pad(Math.floor(total / 60) % 60)}:${pad(total % 60)}`;
}

function tally(id, value, text) {
  const el = $(id);
  el.hidden = !value;
  el.textContent = value ? (text ?? value) : "";
}

/* Последняя оболочка с опроса: «Настройки» рисуются по своему запросу, а знать
   про скачанное обновление им надо. Пусто до первого опроса — и это ничего
   не ломает: панель просто покажет переключатель без подробностей. */
let lastShell = {};

function renderShell(live, shell) {
  lastShell = shell;
  document.documentElement.classList.toggle('server', !!shell.server_mode);
  $("navLive").hidden = !live.farming;
  tally("tallySched", shell.counts.sched);
  tally("tallyGames", shell.counts.games);
  tally("tallyCat", shell.counts.cat);
  // «+3», а не «3»: в остальных пунктах цифра — это сколько там всего,
  // а здесь — сколько прибавилось с прошлого раза
  tally("tallyInv", shell.counts.inv, "+" + shell.counts.inv);
  $("tallyInv").classList.add("new");

  shiftFrom = shell.shift === null ? null : Date.now() - shell.shift * 1000;
  drawShift();

  $("who").hidden = !shell.twitch;
  if (shell.twitch) {
    $("whoName").textContent = shell.twitch;
    $("whoMark").textContent = initials(shell.twitch);
  }

  $("stBar").classList.toggle("live", live.farming);
  $("stFarm").textContent = live.note;
  const traffic = $("stTraffic");
  traffic.hidden = !shell.traffic;
  traffic.querySelector("b").textContent = `${shell.traffic} КБ/мин`;
  const deadline = $("stDeadline");
  deadline.hidden = !shell.deadline;
  // в статусной строке всё разделено точкой, запятой из локали тут не место
  if (shell.deadline) {
    deadline.querySelector("b").textContent = clock(shell.deadline).replace(", ", " · ");
  }
  $("stTelegram").hidden = !shell.telegram;
  $("stVersion").textContent = "v" + shell.version;
  /* Плашка об обновлении: сравнение версий делает служба, тут только показ.
     Ссылка ведёт на страницу релиза: там инсталлер и что изменилось. */
  const upd = $("stUpdate");
  upd.hidden = !shell.update;
  if (shell.update) {
    upd.querySelector("b").textContent = shell.update;
    upd.href = shell.update_url || "https://github.com/ksenobeat/twitch_drops_farmer_vahta/releases";
    // Скачано — значит ставится само на ближайшей границе ломтя, и жать
    // никуда не надо. Молчать об этом нельзя: человек нажмёт и удивится
    $("stUpdWord").textContent = shell.update_ready ? "ставлю версию" : "вышла версия";
    upd.title = shell.update_ready
      ? "Уже скачана и проверена — встанет в ближайшую паузу в фарме"
      : "Открыть релиз на GitHub";
  }

  applyTheme(shell.theme);
}

let planCache = null;
let farmingNow = null;  // кампания, которая правда в эфире
async function tick() {
  /* Два запроса — две судьбы, и мешать их в один `try` нельзя. Когда-то
     было наоборот: план шёл первым и в общем `catch`, и на чистой установке
     его пятисотый (без входа в Twitch обход бросает `LoginRequired`) уносил
     весь опрос. Человек получал пустой «Сейчас», надпись «нет связи
     со службой» — и ни одного шага мастера, хотя служба работала. */
  let live;
  try {
    live = await get("/api/now");
  } catch (e) {
    // а вот здесь надпись честная: не ответила сама служба
    $("stBar").classList.remove("live");
    $("stFarm").textContent = "нет связи со службой";
    return;
  }
  // что фармится на самом деле: «Расписание» рисуется отдельно от «Сейчас»
  // и своими глазами этого не видит
  farmingNow = live.note === "в эфире" ? live.campaign : null;
  renderShell(live, live.shell);
  showEvents(live.events);
  // Мастер здоровается один раз — дальше это записано в настройках. Зовётся
  // до плана намеренно: план строится обходом Twitch, на пустой базе это
  // минуты, и здороваться после него значит здороваться, когда человек уже
  // сам разобрался.
  if (!live.shell.onboarded && !wizDone) openWizard();

  // План перечитываем не каждый опрос (он дорог: блоки на 14 дней вперёд),
  // а когда служба построила новый — `plan_at` это и есть время сборки.
  // Иначе кэш жил до первого действия человека, и «График» показывал
  // доеденные кампании часами: служба уже ушла на следующую игру, а на
  // экране прежний план с блоком в прошлом.
  try {
    if (!planCache || (live.plan_at && live.plan_at !== planCache.starts_at))
      planCache = await get("/api/plan");
  } catch (e) {
    // плана нет — это не «нет связи»: шапка, лента и мастер уже на экране,
    // а причину скажет надпись в «Сейчас». Следующий опрос попробует снова
    return;
  }
  if (!planCache) return;
  // «Сейчас» владеет шапкой и правой колонкой — рисуем его только когда он
  // открыт, иначе опрос затирал бы чужому экрану кнопки
  if ($("p-now").classList.contains("on")) renderNow(live, planCache);
  renderPlan(planCache);
}
tick();
setInterval(tick, 20000);
setInterval(drawShift, 1000);  // часы смены — по своим часам, а не по опросу
</script>
</body>
</html>
